<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bloque Offseason — Jimmy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0d0e;
    --surface:#16181a;
    --surface-2:#1d2023;
    --line:#2a2e32;
    --text:#eef1f2;
    --muted:#8b9296;
    --faint:#5c6266;
    --volt:#c8fb3d;
    --volt-dim:#9bc62c;
    --amber:#ff9d2e;
    --amber-dim:#3a2a14;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Archivo',sans-serif;
    line-height:1.5;
    padding-bottom:60px;
    background-image:radial-gradient(circle at 80% -10%, rgba(200,251,61,0.07), transparent 45%);
  }

  /* ---- Header ---- */
  header{
    padding:max(env(safe-area-inset-top),18px) 20px 16px;
    border-bottom:1px solid var(--line);
  }
  .kicker{
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--volt-dim);font-weight:700;margin-bottom:6px;
  }
  h1{
    font-family:'Anton',sans-serif;font-weight:400;
    font-size:clamp(34px,11vw,46px);line-height:.92;
    letter-spacing:.01em;text-transform:uppercase;
  }
  h1 .accent{color:var(--volt);}
  .sub{color:var(--muted);font-size:13.5px;margin-top:8px;max-width:34ch;}
  .meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .chip{
    font-family:'Spline Sans Mono',monospace;font-size:11px;font-weight:600;
    background:var(--surface);border:1px solid var(--line);
    padding:5px 10px;border-radius:99px;color:var(--muted);
  }
  .chip b{color:var(--text);}

  /* ---- Mode switch ---- */
  .modes{
    display:flex;gap:6px;margin-top:16px;background:var(--surface);
    border:1px solid var(--line);border-radius:13px;padding:4px;
  }
  .mode{
    flex:1;border:none;background:transparent;color:var(--muted);
    border-radius:9px;padding:9px 6px;cursor:pointer;
    font-family:'Archivo',sans-serif;font-weight:700;font-size:12px;
    letter-spacing:.04em;transition:.18s;line-height:1.2;
  }
  .mode small{
    display:block;font-family:'Spline Sans Mono',monospace;font-size:8.5px;
    font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);margin-top:3px;
  }
  .mode.on{background:var(--volt);color:#0c0d0e;}
  .mode.on small{color:#0c0d0e;opacity:.65;}
  .mode.locked{opacity:.55;}
  .mode.locked small{color:var(--amber);}

  /* ---- Phase banner ---- */
  .phase{
    margin:0 16px 4px;padding:13px 15px;border-radius:13px;
    background:linear-gradient(180deg,var(--amber-dim),var(--surface) 70%);
    border:1px solid var(--amber);
  }
  .phase .p-top{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-family:'Spline Sans Mono',monospace;font-size:10px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;color:var(--amber);
  }
  .phase .p-name{
    font-family:'Anton',sans-serif;font-weight:400;font-size:19px;
    text-transform:uppercase;margin-top:5px;letter-spacing:.01em;
  }
  .phase .p-goal{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .phase.pre{background:var(--surface);border-color:var(--line);}
  .phase.pre .p-top{color:var(--faint);}

  /* ---- Day tabs ---- */
  .tabs{
    position:sticky;top:0;z-index:30;
    background:rgba(12,13,14,.86);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    display:flex;gap:6px;overflow-x:auto;padding:10px 14px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
    color:var(--muted);border-radius:11px;padding:8px 13px;cursor:pointer;
    font-weight:700;font-size:13px;display:flex;flex-direction:column;
    align-items:center;line-height:1.15;transition:.18s;min-width:54px;
  }
  .tab small{font-family:'Spline Sans Mono',monospace;font-size:9px;font-weight:600;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;}
  .tab.active{background:var(--volt);color:#0c0d0e;border-color:var(--volt);}
  .tab.active small{color:#0c0d0e;opacity:.7;}

  /* ---- Panels ---- */
  main{padding:20px 16px 0;}
  .panel{display:none;animation:fade .3s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .day-head{margin-bottom:18px;}
  .day-title{
    font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;
    font-size:30px;line-height:1;letter-spacing:.01em;
  }
  .day-focus{
    display:inline-block;margin-top:8px;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.12em;color:var(--volt);
    border:1px solid var(--volt-dim);padding:4px 10px;border-radius:99px;
  }

  /* ---- Section divider ---- */
  .sec{
    display:flex;align-items:center;gap:10px;margin:22px 0 12px;
  }
  .sec:first-of-type{margin-top:4px;}
  .sec span{
    font-family:'Spline Sans Mono',monospace;font-size:10px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
    white-space:nowrap;
  }
  .sec::after{content:'';flex:1;height:1px;background:var(--line);}

  /* ---- Exercise card ---- */
  .ex{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:15px 15px 14px;margin-bottom:11px;
    position:relative;transition:.2s;
  }
  .ex.fst{border-color:var(--amber);background:linear-gradient(180deg,var(--amber-dim),var(--surface) 60%);}
  .ex.done{opacity:.45;}
  .ex.done .ex-name{text-decoration:line-through;text-decoration-color:var(--faint);}
  .ex-top{display:flex;align-items:flex-start;gap:12px;}
  .num{
    font-family:'Anton',sans-serif;font-size:22px;color:var(--faint);
    line-height:1;min-width:24px;padding-top:2px;
  }
  .ex.fst .num{color:var(--amber);}
  .ex-body{flex:1;min-width:0;}
  .ex-name{font-weight:700;font-size:15.5px;line-height:1.25;padding-right:30px;}
  .ex-sets{
    display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap;
  }
  .sets-badge{
    font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:13px;
    background:var(--surface-2);border:1px solid var(--line);
    padding:3px 9px;border-radius:7px;color:var(--text);white-space:nowrap;
  }
  .ex.fst .sets-badge{background:rgba(255,157,46,.14);border-color:var(--amber);color:#ffce93;}
  .rest{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--faint);}
  .fst-tag{
    font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    background:var(--amber);color:#211404;padding:3px 7px;border-radius:6px;
  }
  .tag{
    font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    padding:3px 7px;border-radius:6px;border:1px solid;
  }
  .t-fuerza{color:#ff8f8f;border-color:rgba(255,120,120,.35);background:rgba(255,120,120,.08);}
  .t-hiper{color:#8fc4ff;border-color:rgba(110,170,255,.35);background:rgba(110,170,255,.08);}
  .t-pot{color:#ffb45e;border-color:rgba(255,157,46,.4);background:rgba(255,157,46,.1);}
  .t-core{color:#c99cff;border-color:rgba(180,130,255,.35);background:rgba(180,130,255,.08);}
  .t-skill{color:#6fe6c8;border-color:rgba(90,225,190,.35);background:rgba(90,225,190,.08);}
  .t-esp{color:#ffd36e;border-color:rgba(255,200,90,.4);background:rgba(255,200,90,.1);}
  .t-aer{color:#8adfe8;border-color:rgba(120,215,230,.35);background:rgba(120,215,230,.08);}
  .env{
    font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 7px;border-radius:6px;border:1px solid;
  }
  .e-gym{color:#9aa4ab;border-color:rgba(150,165,175,.3);background:rgba(150,165,175,.07);}
  .e-libre{color:#8adfa0;border-color:rgba(120,220,150,.35);background:rgba(120,220,150,.08);}
  .e-cruz{color:#ffa8a8;border-color:rgba(255,140,140,.4);background:rgba(255,140,140,.1);}
  .opt{
    font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);border:1px dashed var(--line);padding:3px 7px;border-radius:6px;
  }
  .cue{
    font-size:13px;color:var(--muted);margin-top:9px;
    border-top:1px dashed var(--line);padding-top:9px;
  }
  .cue b{color:var(--text);font-weight:600;}

  /* ---- Ver forma ---- */
  .form-btn{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:9px;padding:7px 11px;cursor:pointer;
    font-family:'Archivo',sans-serif;font-weight:600;font-size:11.5px;
    letter-spacing:.04em;transition:.18s;
  }
  .form-btn:active{background:var(--surface-2);color:var(--text);border-color:var(--faint);}
  .form-btn.link{color:var(--volt-dim);border-color:rgba(155,198,44,.3);text-decoration:none;}

  /* done toggle */
  .check{
    position:absolute;top:13px;right:13px;width:24px;height:24px;
    border:1.5px solid var(--line);border-radius:7px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:var(--surface-2);
    transition:.15s;
  }
  .check svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:.15s;}
  .ex.done .check{background:var(--volt);border-color:var(--volt);}
  .ex.done .check svg{opacity:1;transform:scale(1);}
  .check svg path{stroke:#0c0d0e;}

  .reset{
    width:100%;margin:6px 0 30px;padding:12px;border-radius:12px;
    background:transparent;border:1px solid var(--line);color:var(--muted);
    font-family:'Archivo';font-weight:600;font-size:13px;cursor:pointer;
  }
  .reset:active{background:var(--surface);}

  /* ---- Modal ---- */
  .modal{
    position:fixed;inset:0;z-index:60;display:none;
    background:rgba(6,7,8,.9);backdrop-filter:blur(8px);
    align-items:center;justify-content:center;padding:18px;
  }
  .modal.open{display:flex;}
  .sheet{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
    animation:pop .22s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}
  .sheet-head{
    position:sticky;top:0;background:var(--surface);z-index:2;
    padding:18px 18px 12px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  }
  .sheet-title{
    font-family:'Anton',sans-serif;font-weight:400;font-size:20px;
    text-transform:uppercase;line-height:1.05;letter-spacing:.01em;
  }
  .sheet-close{
    background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
    width:30px;height:30px;border-radius:9px;font-size:15px;cursor:pointer;flex:0 0 auto;
  }
  .sheet-body{padding:16px 18px 20px;}
  .shots{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .shot{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .shot img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2);}
  .shot svg{width:100%;display:block;aspect-ratio:4/3;background:var(--surface-2);}
  .shot em{
    position:absolute;left:7px;bottom:7px;font-style:normal;
    font-family:'Spline Sans Mono',monospace;font-size:9px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;
    background:rgba(12,13,14,.82);color:var(--volt);padding:3px 7px;border-radius:6px;
  }
  .steps{margin-top:14px;}
  .steps li{
    font-size:13px;color:var(--muted);margin-bottom:8px;padding-left:22px;
    position:relative;list-style:none;line-height:1.55;
  }
  .steps li::before{
    counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;
    font-family:'Spline Sans Mono',monospace;font-size:10px;font-weight:600;
    color:var(--volt-dim);
  }
  .steps{counter-reset:s;}
  .yt{
    display:block;text-align:center;margin-top:14px;padding:11px;
    border:1px solid var(--line);border-radius:11px;color:var(--muted);
    text-decoration:none;font-weight:600;font-size:12px;letter-spacing:.04em;
  }

  /* ---- Notas ---- */
  .note-block{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;
  }
  .note-block h3{
    font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;
    font-size:19px;letter-spacing:.02em;margin-bottom:10px;color:var(--volt);
  }
  .note-block.amberblk h3{color:var(--amber);}
  .note-block p{font-size:13.5px;color:var(--muted);margin-bottom:9px;}
  .note-block p:last-child{margin-bottom:0;}
  .note-block b{color:var(--text);font-weight:600;}
  .note-block ul{list-style:none;margin-top:4px;}
  .note-block li{font-size:13.5px;color:var(--muted);padding-left:18px;position:relative;margin-bottom:7px;}
  .note-block li::before{content:'';position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:2px;background:var(--volt-dim);}
  .note-block.amberblk li::before{background:var(--amber);}

  .note-block.alert{border-color:#ff5f5f;background:linear-gradient(180deg,rgba(255,60,60,.13),var(--surface) 65%);}
  .note-block.alert h3{color:#ff8f8f;}
  .note-block.alert li::before{background:#ff5f5f;}
  .wk{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px;}
  .wk th{
    text-align:left;font-family:'Spline Sans Mono',monospace;font-size:9.5px;
    font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
    padding:0 8px 7px 0;border-bottom:1px solid var(--line);
  }
  .wk td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:top;}
  .wk td:first-child{color:var(--text);font-weight:600;white-space:nowrap;}
  .wk tr:last-child td{border-bottom:none;}

  footer{text-align:center;color:var(--faint);font-size:11px;padding:8px 0 20px;font-family:'Spline Sans Mono',monospace;}
</style>
</head>
<body>

<header>
  <div class="kicker">Bloque Hipertrofia · PPL ×2</div>
  <h1>Modo <span class="accent">Offseason</span></h1>
  <p class="sub">6 días, cada músculo 2× por semana. Masa como objetivo, con potencia y core integrados.</p>
  <div class="meta-row">
    <span class="chip">RPE <b>8–10</b></span>
    <span class="chip">Compuestos <b>2–3 min</b></span>
    <span class="chip">Aislados <b>60–90 s</b></span>
    <span class="chip"><b>FST-7</b> 30–45 s</span>
  </div>
  <div class="modes" id="modes"></div>
</header>

<div id="phaseBox"></div>
<nav class="tabs" id="tabs"></nav>

<main id="main"></main>

<footer id="foot"></footer>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="mTitle"></div>
      <button class="sheet-close" id="mClose">✕</button>
    </div>
    <div class="sheet-body">
      <div class="shots" id="mShots"></div>
      <ol class="steps" id="mSteps"></ol>
      <a class="yt" id="mYt" target="_blank" rel="noopener">Ver en video ↗</a>
    </div>
  </div>
</div>

<script>
const IMG = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';

/* ============ BLOQUE OFFSEASON ============ */
const OFF = {
  lun:{title:"Push A", focus:"Pecho énfasis", ex:[
    {n:"Flexión pliométrica (con despegue)", s:"3 × 3–5", r:"90 s", tag:"pot", sec:"Potencia · sistema nervioso fresco", id:"Plyo_Push-up",
     cue:"Va <b>primero</b>: la potencia se entrena sin fatiga. Baja controlado, empuja tan fuerte que las manos despeguen. Sin aplauso al inicio; aplauso cuando domines el despegue. <b>Nada de fallo</b>: si pierdes altura, corta la serie."},
    {n:"Press inclinado mancuerna", s:"4 × 6–10", r:"2–3 min", tag:"fuerza", sec:"Bloque principal", id:"Incline_Dumbbell_Press",
     cue:"Banco a 30°. Baja <b>controlado (2–3 s)</b>, codos ~45°, ROM completo. Sube de 35 kg cuando saques 10 limpias."},
    {n:"Press plano máquina o barra", s:"4 × 8–12", r:"2 min", tag:"fuerza", id:"Barbell_Bench_Press_-_Medium_Grip",
     cue:"Pecho medio. Aprieta arriba, estira abajo sin rebotar."},
    {n:"Aperturas en pec deck o polea", s:"7 × 10–12", r:"30–45 s", fst:true, tag:"hiper", id:"Butterfly",
     cue:"Remate del pecho. Peso moderado, busca el <b>estiramiento</b> entre series. La quemazón de las series 5–7 es el objetivo."},
    {n:"Press de hombro con mancuerna", s:"3 × 8–12", r:"90 s", tag:"fuerza", sec:"Hombro y tríceps", id:"Dumbbell_Shoulder_Press",
     cue:"No bloquees del todo arriba para mantener tensión en el deltoide."},
    {n:"Elevaciones laterales", s:"4 × 12–15", r:"60 s", tag:"hiper", id:"Side_Lateral_Raise",
     cue:"Último set <b>dropset</b>. Sube con codos, no con muñecas. Sin balanceo."},
    {n:"Extensión de tríceps en polea", s:"3 × 10–12", r:"60 s", tag:"hiper", id:"Triceps_Pushdown",
     cue:"Codos pegados al cuerpo, extiende completo."},
    {n:"Extensión de tríceps sobre la cabeza", s:"3 × 10–12", r:"60 s", tag:"hiper", id:"Cable_Rope_Overhead_Triceps_Extension",
     cue:"Estira la <b>cabeza larga</b> bajando bien atrás de la cabeza."},
    {n:"Pallof press", s:"3 × 12 /lado", r:"45 s", tag:"core", sec:"Core", id:"Pallof_Press",
     cue:"Anti-rotación. Saca los brazos y <b>resiste que el torso gire</b>. Costillas abajo, glúteo apretado. Esta es la faja que te falta."}
  ]},

  mar:{title:"Pull A", focus:"Espalda grosor", ex:[
    {n:"Lanzamiento de balón medicinal al piso", s:"3 × 5", r:"90 s", tag:"pot", sec:"Potencia · sistema nervioso fresco", id:"Overhead_Slam",
     cue:"Potencia de cadena posterior sin riesgo técnico. Balón de <b>4–8 kg</b>, lánzalo con todo el cuerpo. Si no hay balón, sustituye por <b>kettlebell swing</b> 3 × 10."},
    {n:"Dominadas con lastre o jalón al pecho", s:"4 × 6–10", r:"2–3 min", tag:"fuerza", sec:"Bloque principal", id:"Pullups",
     cue:"Lleva los codos al bolsillo, pecho arriba. Estira completo abajo."},
    {n:"Remo con barra o T-bar", s:"4 × 8–10", r:"2 min", tag:"fuerza", id:"Bent_Over_Barbell_Row",
     cue:"Torso ~45°, espalda neutra. Jala hacia el ombligo, aprieta escápulas."},
    {n:"Remo en máquina con apoyo de pecho", s:"3 × 10–12", r:"90 s", tag:"hiper", id:"Leverage_High_Row",
     cue:"El apoyo quita el balanceo: aísla la espalda, no uses lumbar."},
    {n:"Pullover en polea (brazo recto)", s:"3 × 12–15", r:"90 s", tag:"hiper", id:"Straight-Arm_Pulldown",
     cue:"Brazos casi rectos. Siente el <b>dorsal estirado</b> arriba."},
    {n:"Deltoide posterior (pec deck inverso)", s:"3 × 15", r:"60 s", tag:"hiper", id:"Reverse_Machine_Flyes",
     cue:"Reps altas, peso ligero. Abre con los codos."},
    {n:"Curl con barra", s:"3 × 8–10", r:"90 s", tag:"hiper", sec:"Bíceps", id:"Barbell_Curl",
     cue:"Codos quietos pegados al torso. Sin impulso de cadera."},
    {n:"Curl inclinado con mancuerna", s:"3 × 10–12", r:"60 s", tag:"hiper", opt:true, id:"Incline_Dumbbell_Curl",
     cue:"Banco inclinado = bíceps en <b>estiramiento</b>. Brazos atrás del cuerpo. <b>Es el primero que se corta</b> si el día se alarga: ya llevas tres ejercicios de bíceps."},
    {n:"Curl en polea", s:"7 × 12", r:"30–45 s", fst:true, tag:"hiper", id:"Standing_Biceps_Cable_Curl",

    <h3>El protocolo</h3>
    <p>La adaptación se logra en aproximadamente <b>6 a 8 días</b> de exposición, y los protocolos de investigación usan bloques de <b>10 a 14 días</b> de ejercicio suave a moderado en calor para consolidarla.</p>
    <ul>
      <li><b>10 a 14 días seguidos</b>, o casi seguidos, de exposición.</li>
      <li><b>60 a 90 minutos</b> por sesión, esfuerzo <b>conversacional</b>. No es entrenamiento duro: es exposición.</li>
      <li><b>En el horario del evento</b> y con ropa parecida a la que usarás. La túnica cambia todo respecto a entrenar en playera.</li>
      <li>Termina el bloque <b>3 a 5 días antes</b> del evento.</li>
    </ul>
    <p><b>Cuándo colocarlo:</b> las últimas dos semanas de febrero y los primeros días de marzo, empalmado con la fase 3.</p>
  </div>
  <div class="note-block">
    <h3>Por qué no en enero</h3>
    <p>Porque se pierde. La evidencia indica que se pierde alrededor de <b>1 día de adaptación por cada 2 días sin exposición</b>, y que la pérdida es completa a las <b>6 semanas</b>. Un bloque de calor en enero no te sirve de nada en marzo.</p>
    <p>La buena noticia es que <b>re-aclimatarse toma poco</b>, unos 4 a 5 días. Si te enfermas o pierdes el bloque, todavía hay rescate. Y si entre el bloque y el evento pasan más de 5 días, mete una sesión suelta en calor cada quinto día para sostener la adaptación.</p>
  </div>
  <div class="note-block alert">
    <h3>Señales de alarma · aprendértelas de memoria</h3>
    <p>Esto aplica tanto en los entrenamientos en calor como el día del evento. <b>Para si aparece cualquiera de estas:</b></p>
    <ul>
      <li>Dejas de sudar aunque siga haciendo calor</li>
      <li>Piel caliente y seca, o al contrario, escalofríos bajo el sol</li>
      <li>Dolor de cabeza que va creciendo, náusea, mareo</li>
      <li>Calambres que no ceden</li>
      <li>Te cuesta seguir una conversación o no recuerdas en qué parte del recorrido vas</li>
    </ul>
    <p><b>La confusión mental es una emergencia médica</b>, no un signo de cansancio. Si alguien nota que estás desorientado, el evento se acabó para ti en ese momento: sombra, ropa fuera, agua fría en cuello e ingles, y atención médica. El golpe de calor mata y avanza rápido.</p>
    <p>Dile a tu equipo estas señales <b>antes</b> del evento, porque el que las va a notar primero no eres tú. Y acuerda desde ahora que si alguien pide parar, se para, sin discusión. Nadie que colapsó a la mitad pensó cinco minutos antes que estaba en problemas.</p>
  </div>
  <div class="note-block">
    <h3>Hidratación</h3>
    <p>Empieza el día bien hidratado, no cargando agua a última hora. Durante el evento, bebe <b>a intervalos regulares y con sodio</b>, no solo agua simple: en esfuerzos largos con mucho sudor, tomar únicamente agua pura en volumen alto puede diluir el sodio en sangre, y eso es peligroso por sí mismo.</p>
    <p>Suero oral, bebida deportiva o agua con una pizca de sal y algo de fruta funcionan. Practícalo en los simulacros de febrero: el día del evento no es momento de estrenar nada.</p>
  </div>
  <div class="note-block alert">
    <h3>Si piensas ayunar</h3>
    <p>Muchas representaciones incluyen ayuno o abstinencia previa. <b>Si ese es tu caso, dilo con tiempo a quien te acompañe y considéralo seriamente con un médico.</b></p>
    <p>Ayuno más deshidratación más 150 kg más sol más tres kilómetros es una combinación de factores de riesgo que se multiplican entre sí, no que se suman. Se puede honrar la disciplina y aun así tomar agua, o comer ligero antes. Vale la pena hablarlo con quien coordina el evento, porque llegar a la meta en camilla no le sirve a nadie.</p>
  </div>
`;

    <ul>
      <li><b>Protección de hombro.</b> Acolchado bajo la túnica, en el lado que carga. Pruébalo en los simulacros de febrero, no el mismo día.</li>

      <li><b>Alguien con agua</b> siguiéndote todo el recorrido.</li>
    </ul>
  </div>
  <div class="note-block amberblk">
    <h3>Durante el recorrido</h3>
    <ul>
      <li><b>Cambia de hombro</b> en cada oportunidad que el guion permita. Por eso entrenaste los dos lados.</li>
      <li><b>Pasos cortos, sobre todo en bajada.</b> El paso largo cuesta abajo es lo que dobla la rodilla y lo que hace que la carga se te vaya al frente.</li>
      <li><b>Respiración corta y constante.</b> No aguantes el aire bajo carga: sube la presión y te marea.</li>
      <li><b>Bebe en cada estación</b> aunque no tengas sed. La sed llega tarde.</li>
      <li><b>En las paradas, mantente erguido.</b> Doblarte bajo carga es donde se lastima la espalda baja.</li>
    </ul>
  </div>

    <h3>Parar no es fallar</h3>
    <p>Vas a cargar 150 kg bajo el sol frente a gente que te está viendo, y en ese contexto la presión de aguantar es enorme. Vale la pena decidir ahora, con la cabeza fría, algo que en el momento va a ser muy difícil decidir: <b>hay un punto en el que parar es la decisión correcta.</b></p>
    <p>Acuerda con tu equipo, desde antes, una señal y una regla: si aparece cualquiera de las señales de alarma de la pestaña CALOR, se para. Sin negociar, sin "aguanto tantito más". Una representación interrumpida se explica; un golpe de calor no siempre se revierte.</p>
  </div>
  <div class="note-block">

    <p>Sombra, líquidos con sal, comida, y una revisión honesta del hombro y la espalda en los días siguientes. Si aparece dolor que no cede en una semana, entumecimiento u hormigueo en el brazo, revísalo con un médico: la carga sostenida sobre la clavícula puede irritar estructuras nerviosas y eso no se aguanta, se atiende.</p>
    <p>Deja <b>7 a 10 días de descanso real</b> antes de volver al bloque de offseason. Habrás acumulado más fatiga estructural de la que sientes.</p>
  </div>
  <div class="note-block">

  </div>

  movi: [
   ['Pecho · 30 s por lado', S_+G_+'<line x1="104" y1="28" x2="104" y2="106" stroke="#5c6266" stroke-width="4"/><circle cx="68" cy="34" r="7" stroke="#eef1f2" stroke-width="3"/><line x1="69" y1="41" x2="72" y2="74" stroke="#eef1f2" stroke-width="3"/><line x1="72" y1="74" x2="64" y2="90" stroke="#eef1f2" stroke-width="3"/><line x1="64" y1="90" x2="62" y2="106" stroke="#eef1f2" stroke-width="3"/><line x1="72" y1="74" x2="84" y2="90" stroke="#eef1f2" stroke-width="3"/><line x1="84" y1="90" x2="88" y2="106" stroke="#eef1f2" stroke-width="3"/><line x1="70" y1="48" x2="88" y2="44" stroke="#eef1f2" stroke-width="3"/><line x1="88" y1="44" x2="104" y2="40" stroke="#eef1f2" stroke-width="3"/></svg>'],
   ['Torácica · 10 lentas', S_+G_+'<rect x="108" y="84" width="30" height="7" rx="2" stroke="#2a2e32" stroke-width="3"/><circle cx="99" cy="76" r="6" stroke="#eef1f2" stroke-width="3"/><path d="M54 92 Q76 82 95 82" stroke="#eef1f2" stroke-width="3"/><line x1="95" y1="82" x2="112" y2="85" stroke="#eef1f2" stroke-width="3"/><line x1="54" y1="92" x2="50" y2="106" stroke="#eef1f2" stroke-width="3"/><line x1="54" y1="92" x2="62" y2="106" stroke="#eef1f2" stroke-width="3"/><path d="M84 66 q6 -8 14 -6" stroke="#c8fb3d" stroke-width="3"/></svg>']
  ]

const TAGS = {fuerza:['Fuerza','t-fuerza'], hiper:['Hipertrofia','t-hiper'], pot:['Potencia','t-pot'], core:['Core','t-core'], skill:['Skill','t-skill'], esp:['Específico','t-esp'], aer:['Aeróbico','t-aer']};

const BLOCKS = {
  off:{
    name:'Offseason', tag:'PPL ×2', key:'rutina_done',
    kicker:'Bloque Hipertrofia · PPL ×2', h1:'Modo <span class="accent">Offseason</span>',
    sub:'6 días, cada músculo 2× por semana. Masa como objetivo, con potencia y core integrados.',
    chips:['RPE <b>8–10</b>','Compuestos <b>2–3 min</b>','Aislados <b>60–90 s</b>','<b>FST-7</b> 30–45 s'],
    foot:'Doble progresión · Deload cada 6–8 sem · Domingo descanso',
    days:OFF,
    tabs:[['lun','LUN','Push A'],['mar','MAR','Pull A'],['mie','MIÉ','Legs A'],['jue','JUE','Push B'],['vie','VIE','Pull B'],['sab','SÁB','Legs B'],['notas','NOTAS','Reglas']],
    pages:{notas:OFF_NOTAS}
  },
  cruz:{
    name:'Reto Marzo', tag:'Vía Crucis', key:'rutina_cruz',
    kicker:'Bloque Específico · 13 semanas', h1:'Reto <span class="accent">Marzo</span>',
    sub:'3 km con subidas y bajadas, cruz de ~150 kg (~90 kg efectivos al hombro), bajo el sol.',
    chips:['<b>~90 kg</b> al hombro','<b>3</b> gym + <b>3</b> libre','Calor <b>últimas 2 sem</b>','Cruz <b>último mes</b>'],
    foot:'Primero el tejido · Después la carga · Al final el calor',
    days:CRUZ,
    tabs:[['lun','LUN','Yugo'],['mar','MAR','Acarreo'],['mie','MIÉ','Cuello'],['jue','JUE','Calor'],['vie','VIE','Descensos'],['sab','SÁB','Simulacro'],['fases','FASES','Plan'],['calor','CALOR','Protocolo'],['diad','DÍA D','Evento']],
    pages:{fases:FASES, calor:CALOR, diad:DIAD}
  }
};

const main = document.getElementById('main');
const tabs = document.getElementById('tabs');
const modal = document.getElementById('modal');

/* ---- Temporada: el bloque Cruz se activa el 1 de diciembre ---- */
function seasonStart(){
  const n = new Date();
  const y = n.getMonth() >= 11 ? n.getFullYear() : n.getFullYear()-1;
  return new Date(y, 11, 1);
}
function cruzUnlocked(){
  return true;   // pestaña siempre habilitada
}
/* Fecha del evento. Por defecto Viernes Santo 2027 (26 mar). Editable en la pestaña FASES. */
const EVENTO_DEF = '2027-03-26';
function eventoDate(){
  const s = localStorage.getItem('rutina_evento') || EVENTO_DEF;
  return new Date(s + 'T12:00:00');
}
function semanasRestantes(){
  return Math.ceil((eventoDate() - new Date()) / 86400000 / 7);
}
/* Las fases se cuentan HACIA ATRÁS desde el evento, no desde diciembre.
   Así el plan se reajusta solo si la fecha cambia. */
const FASES_DEF = [
  {wr:[18,99],n:'Fase 0 · Antes de tiempo', g:'Todavía falta. Sigue en el bloque de offseason y arranca este cuando queden 16 semanas.'},
  {wr:[12,17],n:'Fase 1 · Tejido',     g:'Acostumbrar hombro, clavícula y cuello. Cargas ligeras, cero dolor. Base aeróbica.'},
  {wr:[7,11], n:'Fase 2 · Carga',      g:'Subir peso en los acarreos, meter pendiente y bajadas. Primer simulacro largo.'},
  {wr:[4,6],  n:'Fase 3 · Específico', g:'Simulacros con carga real en la ruta real. Prepara el bloque de calor.'},
  {wr:[2,3],  n:'Fase 3b · Calor',     g:'Bloque de aclimatación: 10–14 días seguidos bajo el sol, en el horario del evento.'},
  {wr:[0,1],  n:'Fase 4 · Afinar',     g:'Volumen a la mitad. Nada nuevo, nada máximo. Dormir y sostener el calor.'},
  {wr:[-99,-1],n:'Evento pasado',      g:'Descansa 7–10 días de verdad y regresa al bloque de offseason.'}
];
function faseActual(){
  const wr = semanasRestantes();
  return FASES_DEF.find(f => wr >= f.wr[0] && wr <= f.wr[1]) || FASES_DEF[0];
}

let mode = localStorage.getItem('rutina_mode') || 'off';
if(mode === 'cruz' && !cruzUnlocked() && !localStorage.getItem('rutina_preview')) mode = 'off';
let B = BLOCKS[mode];
let store = {};
function loadStore(){
  try { store = JSON.parse(localStorage.getItem(B.key)||'{}'); } catch(e){ store = {}; }
}
function save(){ try{ localStorage.setItem(B.key, JSON.stringify(store)); }catch(e){} }

function renderModes(){
  const unlocked = cruzUnlocked();
  document.getElementById('modes').innerHTML = Object.entries(BLOCKS).map(([k,b])=>{
    const lock = (k==='cruz' && !unlocked);
    return `<button class="mode${k===mode?' on':''}${lock?' locked':''}" data-mode="${k}">
      ${b.name}<small>${lock?'✦ Se activa en diciembre':b.tag}</small></button>`;
  }).join('');
  document.querySelectorAll('[data-mode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const k = btn.dataset.mode;
      if(k===mode) return;
      if(k==='cruz' && !cruzUnlocked()){
        if(!confirm('El bloque del Reto de Marzo está pensado para arrancar el 1 de diciembre.\n\n¿Quieres verlo de todas formas en modo vista previa?')) return;
        localStorage.setItem('rutina_preview','1');
      }
      mode = k; B = BLOCKS[k];
      localStorage.setItem('rutina_mode', k);
      loadStore(); renderShell(); renderTabs(); renderDay(B.tabs[0][0]);
      window.scrollTo({top:0,behavior:'instant'});
    });
  });
}

function renderShell(){
  document.querySelector('.kicker').innerHTML = B.kicker;
  document.querySelector('h1').innerHTML = B.h1;
  document.querySelector('.sub').textContent = B.sub;
  document.querySelector('.meta-row').innerHTML = B.chips.map(c=>`<span class="chip">${c}</span>`).join('');
  document.getElementById('foot').textContent = B.foot;
  renderModes();
  renderPhase();
}

function renderPhase(){
  const box = document.getElementById('phaseBox');
  if(mode !== 'cruz'){ box.innerHTML=''; return; }
  if(!cruzUnlocked()){
    box.innerHTML = `<div class="phase pre"><div class="p-top"><span>Vista previa</span><span>Arranca 1 dic</span></div>
      <div class="p-name">Aún no empieza</div>
      <div class="p-goal">Puedes revisar el plan completo. El seguimiento por semanas se activa el 1 de diciembre.</div></div>`;
    return;
  }
  const wr = semanasRestantes();
  const dias = Math.ceil((eventoDate() - new Date())/86400000);
  const f = faseActual();
  const cuenta = dias > 0 ? `Faltan ${dias} días · ${wr} sem` : 'Evento pasado';
  box.innerHTML = `<div class="phase"><div class="p-top"><span>${cuenta}</span><span>${eventoDate().toLocaleDateString('es-MX',{day:'numeric',month:'short'})}</span></div>
    <div class="p-name">${f.n}</div>
    <div class="p-goal">${f.g}</div></div>`;
}

function renderTabs(){
  tabs.innerHTML = B.tabs.map((t,i)=>
    `<button class="tab${i===0?' active':''}" data-day="${t[0]}">${t[1]}<small>${t[2]}</small></button>`
  ).join('');
}

function renderDay(key){
  if(B.pages[key]){
    tabs.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.day===key));
    main.innerHTML = `<div class="panel active">${B.pages[key]}</div>`;
    const ev = document.getElementById('evInput');
    if(ev){
      ev.value = localStorage.getItem('rutina_evento') || EVENTO_DEF;
      ev.addEventListener('change', ()=>{
        if(!ev.value) return;
        localStorage.setItem('rutina_evento', ev.value);
        renderPhase();
      });
    }
    return;
  }
  tabs.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.day===key));
  const DAYS = B.days;
  const d = DAYS[key];
  let html = `<div class="panel active"><div class="day-head"><div class="day-title">${d.title}</div><br><span class="day-focus">${d.focus}</span></div>`;
  d.ex.forEach((e,i)=>{
    const id = key+'_'+i;
    const done = store[id] ? ' done':'';
    const [label, cls] = TAGS[e.tag] || TAGS.hiper;
    if(e.sec) html += `<div class="sec"><span>${e.sec}</span></div>`;
    html += `<div class="ex${e.fst?' fst':''}${done}" data-id="${id}">
      <div class="check" role="checkbox"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="ex-top">
        <div class="num">${(i+1).toString().padStart(2,'0')}</div>
        <div class="ex-body">
          <div class="ex-name">${e.n}</div>
          <div class="ex-sets">
            <span class="sets-badge">${e.s}</span>
            ${e.fst?'<span class="fst-tag">FST-7</span>':''}
            <span class="tag ${cls}">${label}</span>
            ${e.env?`<span class="env e-${e.env}">${ENVS[e.env]}</span>`:''}
            ${e.opt?'<span class="opt">Opcional</span>':''}
            <span class="rest">⏱ ${e.r}</span>
          </div>
          <div class="cue">${e.cue}</div>
          ${(e.id||e.seq)
            ? `<button class="form-btn" data-form="${key}:${i}">▣ Ver forma</button>`
            : `<a class="form-btn link" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.yt||e.n)}">▷ Ver video</a>`}
        </div>
      </div>
    </div>`;
  });
  html += `<button class="reset" id="resetBtn">Reiniciar marcas de hoy</button></div>`;
  main.innerHTML = html;

  main.querySelectorAll('.ex').forEach(el=>{
    el.querySelector('.check').addEventListener('click', ()=>{
      const id = el.dataset.id;
      el.classList.toggle('done');
      store[id] = el.classList.contains('done');
      if(!store[id]) delete store[id];
      save();
    });
  });
  main.querySelectorAll('[data-form]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const [k,i] = b.dataset.form.split(':');
      openForm(DAYS[k].ex[+i]);
    });
  });
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    DAYS[key].ex.forEach((e,i)=>{ delete store[key+'_'+i]; });
    save(); renderDay(key);
  });
}

function openForm(e){
  document.getElementById('mTitle').textContent = e.n;
  const shots = document.getElementById('mShots');
  if(e.seq && SEQ[e.seq]){
    shots.innerHTML = SEQ[e.seq].map(([lbl,svg])=>`<div class="shot">${svg}<em>${lbl}</em></div>`).join('');
  } else {
    shots.innerHTML = `
      <div class="shot"><img src="${IMG+e.id}/0.jpg" alt="Posición inicial"><em>Inicio</em></div>
      <div class="shot"><img src="${IMG+e.id}/1.jpg" alt="Posición final"><em>Final</em></div>`;
  }
  const steps = e.steps || (e.cue||'').replace(/<[^>]+>/g,'').split(/\.\s+/).filter(s=>s.trim()).map(s=>s.trim().replace(/\.$/,''));
  document.getElementById('mSteps').innerHTML = steps.map(s=>`<li>${s}</li>`).join('');
  document.getElementById('mYt').href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent((e.yt||e.n) + ' técnica correcta');
  modal.classList.add('open');
}

document.getElementById('mClose').addEventListener('click', ()=>modal.classList.remove('open'));
modal.addEventListener('click', ev=>{ if(ev.target===modal) modal.classList.remove('open'); });
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape') modal.classList.remove('open'); });

tabs.addEventListener('click', ev=>{
  const btn = ev.target.closest('.tab');
  if(!btn) return;
  window.scrollTo({top:0,behavior:'instant'});
  renderDay(btn.dataset.day);
});

loadStore();
renderShell();
renderTabs();
renderDay(B.tabs[0][0]);
</script>
</body>
</html>
