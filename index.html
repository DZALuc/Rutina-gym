<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PPL x2 — Jimmy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0d0e;
    --surface:#16181a;
    --surface-2:#1d2023;
    --line:#2a2e32;
    --text:#eef1f2;
    --muted:#8b9296;
    --faint:#5c6266;
    --volt:#c8fb3d;
    --volt-dim:#9bc62c;
    --amber:#ff9d2e;
    --amber-dim:#3a2a14;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Archivo',sans-serif;
    line-height:1.5;
    padding-bottom:60px;
    background-image:radial-gradient(circle at 80% -10%, rgba(200,251,61,0.07), transparent 45%);
  }

  /* ---- Header ---- */
  header{
    padding:max(env(safe-area-inset-top),18px) 20px 16px;
    border-bottom:1px solid var(--line);
  }
  .kicker{
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--volt-dim);font-weight:700;margin-bottom:6px;
  }
  h1{
    font-family:'Anton',sans-serif;font-weight:400;
    font-size:clamp(34px,11vw,46px);line-height:.92;
    letter-spacing:.01em;text-transform:uppercase;
  }
  h1 .accent{color:var(--volt);}
  .sub{color:var(--muted);font-size:13.5px;margin-top:8px;max-width:34ch;}
  .meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .chip{
    font-family:'Spline Sans Mono',monospace;font-size:11px;font-weight:600;
    background:var(--surface);border:1px solid var(--line);
    padding:5px 10px;border-radius:99px;color:var(--muted);
  }
  .chip b{color:var(--text);}

  /* ---- Day tabs ---- */
  .tabs{
    position:sticky;top:0;z-index:30;
    background:rgba(12,13,14,.86);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    display:flex;gap:6px;overflow-x:auto;padding:10px 14px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
    color:var(--muted);border-radius:11px;padding:8px 13px;cursor:pointer;
    font-weight:700;font-size:13px;display:flex;flex-direction:column;
    align-items:center;line-height:1.15;transition:.18s;min-width:54px;
  }
  .tab small{font-family:'Spline Sans Mono',monospace;font-size:9px;font-weight:600;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;}
  .tab.active{background:var(--volt);color:#0c0d0e;border-color:var(--volt);}
  .tab.active small{color:#0c0d0e;opacity:.7;}

  /* ---- Panels ---- */
  main{padding:20px 16px 0;}
  .panel{display:none;animation:fade .3s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .day-head{margin-bottom:18px;}
  .day-title{
    font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;
    font-size:30px;line-height:1;letter-spacing:.01em;
  }
  .day-focus{
    display:inline-block;margin-top:8px;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.12em;color:var(--volt);
    border:1px solid var(--volt-dim);padding:4px 10px;border-radius:99px;
  }

  /* ---- Exercise card ---- */
  .ex{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:15px 15px 14px;margin-bottom:11px;
    position:relative;transition:.2s;
  }
  .ex.fst{border-color:var(--amber);background:linear-gradient(180deg,var(--amber-dim),var(--surface) 60%);}
  .ex.done{opacity:.45;}
  .ex.done .ex-name{text-decoration:line-through;text-decoration-color:var(--faint);}
  .ex-top{display:flex;align-items:flex-start;gap:12px;}
  .num{
    font-family:'Anton',sans-serif;font-size:22px;color:var(--faint);
    line-height:1;min-width:24px;padding-top:2px;
  }
  .ex.fst .num{color:var(--amber);}
  .ex-body{flex:1;min-width:0;}
  .ex-name{font-weight:700;font-size:15.5px;line-height:1.25;}
  .ex-sets{
    display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap;
  }
  .sets-badge{
    font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:13px;
    background:var(--surface-2);border:1px solid var(--line);
    padding:3px 9px;border-radius:7px;color:var(--text);white-space:nowrap;
  }
  .ex.fst .sets-badge{background:rgba(255,157,46,.14);border-color:var(--amber);color:#ffce93;}
  .rest{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--faint);}
  .fst-tag{
    font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    background:var(--amber);color:#211404;padding:3px 7px;border-radius:6px;
  }
  .cue{
    font-size:13px;color:var(--muted);margin-top:9px;
    border-top:1px dashed var(--line);padding-top:9px;
  }
  .cue b{color:var(--text);font-weight:600;}
  
  /* Category badges */
  .category-badge{
    font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 6px;border-radius:5px;
  }
  .cat-strength{ background:rgba(220,38,38,.15); color:#fca5a5; }
  .cat-hypertrophy{ background:rgba(59,130,246,.15); color:#93c5fd; }
  .cat-plyometric{ background:rgba(234,88,12,.15); color:#fed7aa; }
  .cat-core{ background:rgba(147,51,234,.15); color:#d8b4fe; }

  /* done toggle */
  .check{
    position:absolute;top:13px;right:13px;width:24px;height:24px;
    border:1.5px solid var(--line);border-radius:7px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:var(--surface-2);
    transition:.15s;
  }
  .check svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:.15s;}
  .ex.done .check{background:var(--volt);border-color:var(--volt);}
  .ex.done .check svg{opacity:1;transform:scale(1);}

  /* reset button */
  .reset{
    display:block;width:100%;padding:14px;margin-top:22px;margin-bottom:20px;
    border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:11px;cursor:pointer;font-weight:700;font-size:13px;
    transition:.18s;font-family:'Archivo',sans-serif;letter-spacing:.04em;
    text-transform:uppercase;
  }
  .reset:active{background:var(--surface-2);}

  /* Image button */
  .image-btn{
    display:block;width:100%;padding:10px;margin:10px 0;
    background:rgba(200,251,61,.08);border:1px solid rgba(200,251,61,.3);
    color:var(--volt);border-radius:8px;cursor:pointer;
    font-weight:600;font-size:12px;font-family:'Archivo',sans-serif;
    transition:.2s;
  }
  .image-btn:active{background:rgba(200,251,61,.15);}

  /* Modal */
  .modal{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);
    backdrop-filter:blur(8px);z-index:50;align-items:center;justify-content:center;
    padding:20px;
  }
  .modal.active{display:flex;}
  .modal-content{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);max-width:540px;width:100%;max-height:90vh;
    overflow-y:auto;
  }
  .modal-header{
    padding:20px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    position:sticky;top:0;background:var(--surface);z-index:10;
  }
  .modal-title{
    font-family:'Anton',sans-serif;font-weight:400;font-size:22px;
    text-transform:uppercase;
  }
  .modal-close{
    background:none;border:none;color:var(--muted);cursor:pointer;
    font-size:24px;transition:.2s;
  }
  .modal-close:active{color:var(--text);}
  .modal-body{
    padding:20px;background:var(--surface-2);
  }
  .modal-body img{
    width:100%;height:auto;max-height:350px;object-fit:cover;
    border-radius:11px;margin-bottom:16px;border:1px solid var(--line);
  }
  .modal-tip{
    font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px;
  }
  .modal-close-btn{
    width:100%;padding:12px;background:rgba(200,251,61,.1);
    border:1px solid var(--volt-dim);color:var(--volt);border-radius:8px;
    font-weight:700;font-size:13px;cursor:pointer;font-family:'Archivo',sans-serif;
    text-transform:uppercase;
  }
  .modal-close-btn:active{background:rgba(200,251,61,.2);}

  /* Note blocks */
  .note-block{
    background:var(--surface);border:1px solid var(--line);padding:16px;
    border-radius:var(--radius);margin-bottom:14px;
  }
  .note-block h3{
    font-family:'Anton',sans-serif;font-weight:400;font-size:16px;
    text-transform:uppercase;margin-bottom:10px;color:var(--text);
    letter-spacing:.01em;
  }
  .note-block p{
    font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:10px;
  }
  .note-block p:last-child{margin-bottom:0;}
  .note-block p b{color:var(--text);}
  .note-block.amberblk{
    border-color:var(--amber);background:linear-gradient(180deg,var(--amber-dim),var(--surface) 60%);
  }
  .note-block.amberblk h3{color:var(--amber);}
</style>
</head>

<main id="main"></main>

</div>

    <h3>Opción A: Integración Gradual</h3>
    <p>Agregamos <b>2–3 ejercicios nuevos por día</b> a tu PPL x2 original. Duración: +15 min por sesión (75–80 min).</p>
    <p><b>Nuevos elementos:</b> Pliométricos (explosividad), Core avanzado (faja natural), e imágenes de referencia en cada ejercicio.</p>
    <p>Mantén pesos de fuerza sin cambios. Hipertrofia y FST-7 intactos. Adaptación gradual: esperamos 2–3 semanas para sentir la explosividad.</p>
  </div>
  <div class="note-block amberblk">
    <h3>Categorías de ejercicios</h3>
    <p><b>Fuerza (rojo):</b> Compuestos pesados, movimientos primarios. <b>Hipertrofia (azul):</b> Aislamientos, reps altas, bomba. <b>Pliométrico (naranja):</b> Explosividad, potencia. <b>Core (púrpura):</b> Anti-movimiento, estabilidad.</p>
  </div>
  <div class="note-block">
    <h3>Usar las imágenes</h3>
    <p>Cada ejercicio tiene un botón <b>📸 Ver forma</b>. Abre una imagen de referencia. Úsala antes de entrenar si es tu primer intento o si dudas de la técnica.</p>
  </div>
  <div class="note-block amberblk">
    <h3>Progresión (Próximas 12 semanas)</h3>
    <p><b>Semanas 1–4:</b> Adaptación. Pliométricos bajo volumen, forma perfecta. Mantén pesos.</p>
    <p><b>Semanas 5–8:</b> Consolida. Incrementa peso +2–3%, aumenta reps en pliométricos.</p>
    <p><b>Semanas 9+:</b> Potencia. Peso +2–5%, pliométricos máximo, core holds prolongados. En 6–9 meses: piruetas spider-man viable.</p>
  </div>
  <div class="note-block">
    <h3>Recovery</h3>
    <p><b>Proteína:</b> 1.8–2.0 g/kg (160–180g/día). <b>Sueño:</b> 7–8h (pliométricos requieren CNS recovery). <b>Calorías:</b> Lean bulk ligero (+300 kcal si buscas definición).</p>
  </div>
`;

const main = document.getElementById('main');
const tabs = document.getElementById('tabs');
const imageModal = document.getElementById('imageModal');
const modalClose = document.getElementById('modalClose');
const closeModalBtn = document.getElementById('closeModalBtn');

let store = {};
try { store = JSON.parse(localStorage.getItem('rutina_done_v2')||'{}'); } catch(e){ store = {}; }
function save(){ try{ localStorage.setItem('rutina_done_v2', JSON.stringify(store)); }catch(e){} }

function getCategoryBadge(cat){
  const labels = {strength:'Fuerza', hypertrophy:'Hipertrofia', plyometric:'Pliométrico', core:'Core'};
  const classes = {strength:'cat-strength', hypertrophy:'cat-hypertrophy', plyometric:'cat-plyometric', core:'cat-core'};
  return `<span class="category-badge ${classes[cat]}">${labels[cat]}</span>`;
}

function renderDay(key){
  const d = DAYS[key];
  let html = `<div class="panel active"><div class="day-head"><div class="day-title">${d.title}</div><br><span class="day-focus">${d.focus}</span></div>`;
  d.ex.forEach((e,i)=>{
    const id = key+'_'+i;
    const done = store[id] ? ' done':'';
    html += `<div class="ex${e.fst?' fst':''}${done}" data-id="${id}">
      <div class="check" role="checkbox"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="ex-top">
        <div class="num">${(i+1).toString().padStart(2,'0')}</div>
        <div class="ex-body">
          <div class="ex-name">${e.n}</div>
          <div class="ex-sets">
            <span class="sets-badge">${e.s}</span>
            ${e.fst?'<span class="fst-tag">FST-7</span>':''}
            <span class="rest">⏱ ${e.r}</span>
            ${getCategoryBadge(e.cat)}
          </div>
          ${e.img?`<button class="image-btn" onclick="showImage('${e.n}', '${e.img}'); return false;">📸 Ver forma correcta</button>`:''}
          <div class="cue">${e.cue || 'Mantén buena forma. Si no llega, reduce peso.'}</div>
        </div>
      </div>
    </div>`;
  });
  html += `<button class="reset" id="resetBtn">Reiniciar marcas de hoy</button></div>`;
  main.innerHTML = html;

  main.querySelectorAll('.ex').forEach(el=>{
    el.querySelector('.check').addEventListener('click', ()=>{
      const id = el.dataset.id;
      el.classList.toggle('done');
      store[id] = el.classList.contains('done');
      if(!store[id]) delete store[id];
      save();
    });
  });
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    DAYS[key].ex.forEach((e,i)=>{ delete store[key+'_'+i]; });
    save(); renderDay(key);
  });
}

function renderNotas(){
  main.innerHTML = `<div class="panel active">${NOTAS}</div>`;
}

function showImage(name, image){
  document.getElementById('modalTitle').textContent = name;
  document.getElementById('modalImage').src = image;
  imageModal.classList.add('active');
}

modalClose.addEventListener('click', ()=>{
  imageModal.classList.remove('active');
});
closeModalBtn.addEventListener('click', ()=>{
  imageModal.classList.remove('active');
});
imageModal.addEventListener('click', (e)=>{
  if(e.target === imageModal) imageModal.classList.remove('active');
});

tabs.addEventListener('click', ev=>{
  const btn = ev.target.closest('.tab');
  if(!btn) return;
  tabs.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const day = btn.dataset.day;
  window.scrollTo({top:0,behavior:'instant'});
  if(day==='notas') renderNotas(); else renderDay(day);
});

renderDay('lun');
</script>
</body>
</html>
