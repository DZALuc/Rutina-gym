<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rutina">
<meta name="description" content="Rutina de gimnasio con registro de marcas, progresión automática y plan del Vía Crucis. Funciona sin conexión.">
<title>Bloque Offseason — Jimmy</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0d0e;
    --surface:#16181a;
    --surface-2:#1d2023;
    --line:#2a2e32;
    --text:#eef1f2;
    --muted:#8b9296;
    --faint:#5c6266;
    --volt:#c8fb3d;
    --volt-dim:#9bc62c;
    --amber:#ff9d2e;
    --amber-dim:#3a2a14;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Archivo',sans-serif;
    line-height:1.5;
    padding-bottom:60px;
    background-image:radial-gradient(circle at 80% -10%, rgba(200,251,61,0.07), transparent 45%);
  }

  /* ---- Header ---- */
  header{
    padding:max(env(safe-area-inset-top),18px) 20px 16px;
    border-bottom:1px solid var(--line);
  }
  .kicker{
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--volt-dim);font-weight:700;margin-bottom:6px;
  }
  h1{
    font-family:'Anton',sans-serif;font-weight:400;
    font-size:clamp(34px,11vw,46px);line-height:.92;
    letter-spacing:.01em;text-transform:uppercase;
  }
  h1 .accent{color:var(--volt);}
  .sub{color:var(--muted);font-size:13.5px;margin-top:8px;max-width:34ch;}
  .meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .chip{
    font-family:'Spline Sans Mono',monospace;font-size:11px;font-weight:600;
    background:var(--surface);border:1px solid var(--line);
    padding:5px 10px;border-radius:99px;color:var(--muted);
  }
  .chip b{color:var(--text);}

  /* ---- Mode switch ---- */
  .modes{
    display:flex;gap:6px;margin-top:16px;background:var(--surface);
    border:1px solid var(--line);border-radius:13px;padding:4px;
  }
  .mode{
    flex:1;border:none;background:transparent;color:var(--muted);
    border-radius:9px;padding:9px 6px;cursor:pointer;
    font-family:'Archivo',sans-serif;font-weight:700;font-size:12px;
    letter-spacing:.04em;transition:.18s;line-height:1.2;
  }
  .mode small{
    display:block;font-family:'Spline Sans Mono',monospace;font-size:8.5px;
    font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);margin-top:3px;
  }
  .mode.on{background:var(--volt);color:#0c0d0e;}
  .mode.on small{color:#0c0d0e;opacity:.65;}
  .mode.locked{opacity:.55;}
  .mode.locked small{color:var(--amber);}

  /* ---- Phase banner ---- */
  .phase{
    margin:0 16px 4px;padding:13px 15px;border-radius:13px;
    background:linear-gradient(180deg,var(--amber-dim),var(--surface) 70%);
    border:1px solid var(--amber);
  }
  .phase .p-top{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-family:'Spline Sans Mono',monospace;font-size:10px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;color:var(--amber);
  }
  .phase .p-name{
    font-family:'Anton',sans-serif;font-weight:400;font-size:19px;
    text-transform:uppercase;margin-top:5px;letter-spacing:.01em;
  }
  .phase .p-goal{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .phase.pre{background:var(--surface);border-color:var(--line);}
  .phase.pre .p-top{color:var(--faint);}

  /* ---- Day tabs ---- */
  .tabs{
    position:sticky;top:0;z-index:30;
    background:rgba(12,13,14,.86);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    display:flex;gap:6px;overflow-x:auto;padding:10px 14px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
    color:var(--muted);border-radius:11px;padding:8px 13px;cursor:pointer;
    font-weight:700;font-size:13px;display:flex;flex-direction:column;
    align-items:center;line-height:1.15;transition:.18s;min-width:54px;
  }
  .tab small{font-family:'Spline Sans Mono',monospace;font-size:9px;font-weight:600;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;}
  .tab.active{background:var(--volt);color:#0c0d0e;border-color:var(--volt);}
  .tab.active small{color:#0c0d0e;opacity:.7;}

  /* ---- Panels ---- */
  main{padding:20px 16px 0;}
  .panel{display:none;animation:fade .3s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .day-head{margin-bottom:18px;}
  .day-title{
    font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;
    font-size:30px;line-height:1;letter-spacing:.01em;
  }
  .day-focus{
    display:inline-block;margin-top:8px;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.12em;color:var(--volt);
    border:1px solid var(--volt-dim);padding:4px 10px;border-radius:99px;
  }

  /* ---- Section divider ---- */
  .sec{
    display:flex;align-items:center;gap:10px;margin:22px 0 12px;
  }
  .sec:first-of-type{margin-top:4px;}
  .sec span{
    font-family:'Spline Sans Mono',monospace;font-size:10px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
    white-space:nowrap;
  }
  .sec::after{content:'';flex:1;height:1px;background:var(--line);}

  /* ---- Exercise card ---- */
  .ex{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:15px 15px 14px;margin-bottom:11px;
    position:relative;transition:.2s;
  }
  .ex.fst{border-color:var(--amber);background:linear-gradient(180deg,var(--amber-dim),var(--surface) 60%);}
  .ex.done{opacity:.45;}
  .ex.done .ex-name{text-decoration:line-through;text-decoration-color:var(--faint);}
  .ex-top{display:flex;align-items:flex-start;gap:12px;}
  .num{
    font-family:'Anton',sans-serif;font-size:22px;color:var(--faint);
    line-height:1;min-width:24px;padding-top:2px;
  }
  .ex.fst .num{color:var(--amber);}
  .ex-body{flex:1;min-width:0;}
  .ex-name{font-weight:700;font-size:15.5px;line-height:1.25;padding-right:30px;}
  .ex-sets{
    display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap;
  }
  .sets-badge{
    font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:13px;
    background:var(--surface-2);border:1px solid var(--line);
    padding:3px 9px;border-radius:7px;color:var(--text);white-space:nowrap;
  }
  .ex.fst .sets-badge{background:rgba(255,157,46,.14);border-color:var(--amber);color:#ffce93;}
  .rest{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--faint);}
  .fst-tag{
    font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    background:var(--amber);color:#211404;padding:3px 7px;border-radius:6px;
  }
  .tag{
    font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    padding:3px 7px;border-radius:6px;border:1px solid;
  }
  .t-fuerza{color:#ff8f8f;border-color:rgba(255,120,120,.35);background:rgba(255,120,120,.08);}
  .t-hiper{color:#8fc4ff;border-color:rgba(110,170,255,.35);background:rgba(110,170,255,.08);}
  .t-pot{color:#ffb45e;border-color:rgba(255,157,46,.4);background:rgba(255,157,46,.1);}
  .t-core{color:#c99cff;border-color:rgba(180,130,255,.35);background:rgba(180,130,255,.08);}
  .t-skill{color:#6fe6c8;border-color:rgba(90,225,190,.35);background:rgba(90,225,190,.08);}
  .t-esp{color:#ffd36e;border-color:rgba(255,200,90,.4);background:rgba(255,200,90,.1);}
  .t-aer{color:#8adfe8;border-color:rgba(120,215,230,.35);background:rgba(120,215,230,.08);}
  .env{
    font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 7px;border-radius:6px;border:1px solid;
  }
  .e-gym{color:#9aa4ab;border-color:rgba(150,165,175,.3);background:rgba(150,165,175,.07);}
  .e-libre{color:#8adfa0;border-color:rgba(120,220,150,.35);background:rgba(120,220,150,.08);}
  .e-cruz{color:#ffa8a8;border-color:rgba(255,140,140,.4);background:rgba(255,140,140,.1);}
  .opt{
    font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);border:1px dashed var(--line);padding:3px 7px;border-radius:6px;
  }
  .cue{
    font-size:13px;color:var(--muted);margin-top:9px;
    border-top:1px dashed var(--line);padding-top:9px;
  }
  .cue b{color:var(--text);font-weight:600;}

  /* ---- Ver forma ---- */
  .form-btn{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:9px;padding:7px 11px;cursor:pointer;
    font-family:'Archivo',sans-serif;font-weight:600;font-size:11.5px;
    letter-spacing:.04em;transition:.18s;
  }
  .form-btn:active{background:var(--surface-2);color:var(--text);border-color:var(--faint);}
  .form-btn.link{color:var(--volt-dim);border-color:rgba(155,198,44,.3);text-decoration:none;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;}
  .form-btn.hot{color:#dfff8a;border-color:var(--volt-dim);background:rgba(200,251,61,.08);}
  .form-btn.warm{color:#ffce93;border-color:var(--amber);background:rgba(255,157,46,.08);}
  .logbox{
    display:none;margin-top:10px;padding:12px;border-radius:12px;
    background:var(--surface-2);border:1px solid var(--line);
  }
  .logbox.open{display:block;}
  .log-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;}
  .log-pr{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--muted);}
  .log-pr b{color:var(--volt);font-weight:600;}
  .log-pr.dim{color:var(--faint);}
  .spark{width:96px;height:26px;flex:0 0 auto;}
  .log-hist{
    display:flex;justify-content:space-between;
    font-family:'Spline Sans Mono',monospace;font-size:11.5px;color:var(--text);
    padding:4px 0;border-bottom:1px dashed var(--line);
  }
  .log-hist span{color:var(--faint);font-size:10px;}
  .sugg{
    margin-top:9px;font-size:12.5px;line-height:1.45;padding:9px 11px;border-radius:9px;
    border:1px solid var(--line);color:var(--muted);
  }
  .sugg.s-volt{border-color:var(--volt-dim);color:#dfff8a;background:rgba(200,251,61,.07);}
  .sugg.s-amber{border-color:var(--amber);color:#ffce93;background:rgba(255,157,46,.08);}
  .log-inputs{display:flex;gap:7px;margin-top:10px;}
  .log-inputs input{
    width:0;flex:1;background:var(--bg);border:1px solid var(--line);color:var(--text);
    font-family:'Spline Sans Mono',monospace;font-size:13px;padding:9px 10px;border-radius:9px;
  }
  .log-inputs input:focus{outline:none;border-color:var(--volt-dim);}
  .logbtn{
    background:var(--volt);color:#0c0d0e;border:none;border-radius:9px;
    font-family:'Archivo',sans-serif;font-weight:700;font-size:12px;
    padding:9px 14px;cursor:pointer;flex:0 0 auto;
  }
  .logbtn:active{background:var(--volt-dim);}
  .logundo{
    background:transparent;border:1px solid var(--line);color:var(--faint);
    border-radius:9px;padding:9px 11px;cursor:pointer;font-size:13px;flex:0 0 auto;
  }
  .logundo:active{color:var(--text);}

  /* done toggle */
  .check{
    position:absolute;top:13px;right:13px;width:24px;height:24px;
    border:1.5px solid var(--line);border-radius:7px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:var(--surface-2);
    transition:.15s;
  }
  .check svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:.15s;}
  .ex.done .check{background:var(--volt);border-color:var(--volt);}
  .ex.done .check svg{opacity:1;transform:scale(1);}
  .check svg path{stroke:#0c0d0e;}

  .reset{
    width:100%;margin:6px 0 30px;padding:12px;border-radius:12px;
    background:transparent;border:1px solid var(--line);color:var(--muted);
    font-family:'Archivo';font-weight:600;font-size:13px;cursor:pointer;
  }
  .reset:active{background:var(--surface);}

  /* ---- Modal ---- */
  .modal{
    position:fixed;inset:0;z-index:60;display:none;
    background:rgba(6,7,8,.9);backdrop-filter:blur(8px);
    align-items:center;justify-content:center;padding:18px;
  }
  .modal.open{display:flex;}
  .sheet{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
    animation:pop .22s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}
  .sheet-head{
    position:sticky;top:0;background:var(--surface);z-index:2;
    padding:18px 18px 12px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  }
  .sheet-title{
    font-family:'Anton',sans-serif;font-weight:400;font-size:20px;
    text-transform:uppercase;line-height:1.05;letter-spacing:.01em;
  }
  .sheet-close{
    background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
    width:30px;height:30px;border-radius:9px;font-size:15px;cursor:pointer;flex:0 0 auto;
  }
  .sheet-body{padding:16px 18px 20px;}
  .shots{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .shot{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .shot img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2);}
  .shot svg{width:100%;display:block;aspect-ratio:4/3;background:var(--surface-2);}
  .shot em{
    position:absolute;left:7px;bottom:7px;font-style:normal;
    font-family:'Spline Sans Mono',monospace;font-size:9px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;
    background:rgba(12,13,14,.82);color:var(--volt);padding:3px 7px;border-radius:6px;
  }
  .steps{margin-top:14px;}
  .steps li{
    font-size:13px;color:var(--muted);margin-bottom:8px;padding-left:22px;
    position:relative;list-style:none;line-height:1.55;
  }
  .steps li::before{
    counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;
    font-family:'Spline Sans Mono',monospace;font-size:10px;font-weight:600;
    color:var(--volt-dim);
  }
  .steps{counter-reset:s;}
  .yt{
    display:block;text-align:center;margin-top:14px;padding:11px;
    border:1px solid var(--line);border-radius:11px;color:var(--muted);
    text-decoration:none;font-weight:600;font-size:12px;letter-spacing:.04em;
  }

  /* ---- Notas ---- */
  .note-block{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;
  }
  .note-block h3{
    font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;
    font-size:19px;letter-spacing:.02em;margin-bottom:10px;color:var(--volt);
  }
  .note-block.amberblk h3{color:var(--amber);}
  .note-block p{font-size:13.5px;color:var(--muted);margin-bottom:9px;}
  .note-block p:last-child{margin-bottom:0;}
  .note-block b{color:var(--text);font-weight:600;}
  .note-block ul{list-style:none;margin-top:4px;}
  .note-block li{font-size:13.5px;color:var(--muted);padding-left:18px;position:relative;margin-bottom:7px;}
  .note-block li::before{content:'';position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:2px;background:var(--volt-dim);}
  .note-block.amberblk li::before{background:var(--amber);}

  /* ---- Exportar / importar marcas ---- */
  .io-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .io-btn{
    flex:1 1 0;min-width:132px;
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:10px;padding:10px 12px;cursor:pointer;
    font-family:'Archivo',sans-serif;font-weight:600;font-size:12px;letter-spacing:.04em;
    transition:.18s;
  }
  .io-btn:active{background:var(--surface-2);color:var(--text);border-color:var(--faint);}
  .io-btn:disabled{opacity:.45;cursor:default;}
  /* ---- Progreso de descarga de fotos ---- */
  .prog{display:none;margin-top:12px;}
  .prog.on{display:block;}
  .prog-bar{
    height:6px;border-radius:99px;background:var(--surface-2);
    border:1px solid var(--line);overflow:hidden;
  }
  .prog-bar i{
    display:block;height:100%;width:0;background:var(--volt);
    border-radius:99px;transition:width .18s linear;
  }
  .prog-txt{
    margin-top:7px;font-family:'Spline Sans Mono',monospace;font-size:11px;
    color:var(--muted);display:flex;justify-content:space-between;gap:10px;
  }
  .prog-txt b{color:var(--volt);font-weight:600;}
  .io-msg{
    margin-top:10px;font-size:12.5px;line-height:1.45;padding:9px 11px;border-radius:9px;
    border:1px solid var(--volt-dim);color:#dfff8a;background:rgba(200,251,61,.07);
  }
  .io-msg.err{border-color:var(--amber);color:#ffce93;background:rgba(255,157,46,.08);}

  .note-block.alert{border-color:#ff5f5f;background:linear-gradient(180deg,rgba(255,60,60,.13),var(--surface) 65%);}
  .note-block.alert h3{color:#ff8f8f;}
  .note-block.alert li::before{background:#ff5f5f;}
  .wk{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px;}
  .wk th{
    text-align:left;font-family:'Spline Sans Mono',monospace;font-size:9.5px;
    font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
    padding:0 8px 7px 0;border-bottom:1px solid var(--line);
  }
  .wk td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:top;}
  .wk td:first-child{color:var(--text);font-weight:600;white-space:nowrap;}
  .wk tr:last-child td{border-bottom:none;}

  footer{text-align:center;color:var(--faint);font-size:11px;padding:8px 0 20px;font-family:'Spline Sans Mono',monospace;}
</style>
</head>
<body>

<header>
  <div class="kicker">Bloque Hipertrofia · PPL ×2</div>
  <h1>Modo <span class="accent">Offseason</span></h1>
  <p class="sub">6 días, cada músculo 2× por semana. Masa como objetivo, con potencia y core integrados.</p>
  <div class="meta-row">
    <span class="chip">RPE <b>8–10</b></span>
    <span class="chip">Compuestos <b>2–3 min</b></span>
    <span class="chip">Aislados <b>60–90 s</b></span>
    <span class="chip"><b>FST-7</b> 30–45 s</span>
  </div>
  <div class="modes" id="modes"></div>
</header>

<div id="phaseBox"></div>
<nav class="tabs" id="tabs"></nav>

<main id="main"></main>

<footer id="foot"></footer>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="mTitle"></div>
      <button class="sheet-close" id="mClose">✕</button>
    </div>
    <div class="sheet-body">
      <div class="shots" id="mShots"></div>
      <ol class="steps" id="mSteps"></ol>
      <a class="yt" id="mYt" target="_blank" rel="noopener">Ver en video ↗</a>
    </div>
  </div>
</div>

<script>
const IMG = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';

/* ============ BLOQUE OFFSEASON ============ */
const OFF = {
  lun:{title:"Push A", focus:"Pecho énfasis", ex:[

      <tr><td>2 · Carga</td><td>Faltan 11–7 sem<br>Enero</td><td>Subir peso en acarreos, meter pendiente y bajadas. Primer simulacro de 1.5–2 km.</td></tr>

    <p style="margin-top:12px">Tres días de gimnasio, dos de aire libre, uno de simulacro. Si una semana solo puedes entrenar cuatro días, el orden de prioridad es: <b>martes, sábado, viernes, miércoles</b>. El acarreo y el simulacro no se negocian.</p>
  </div>
  <div class="note-block amberblk">
    <h3>Qué se sacrifica</h3>
    <p>Esto no es tu bloque de hipertrofia con extras. Es un plan distinto y algo se cede:</p>
    <ul>
      <li><b>Se va el FST-7.</b> Las 7 series de bombeo compiten directamente con la recuperación que necesitan los acarreos.</li>
      <li><b>Se va casi todo el aislamiento de brazo.</b> Queda lo mínimo para no perder tamaño.</li>
      <li><b>Se van los pliométricos.</b> El tejido conectivo tiene un presupuesto y en este bloque se lo lleva el acarreo. La pliometría de salto también se pausa: el presupuesto de tendón se lo lleva el acarreo, y el salto vuelve con el offseason.</li>
      <li><b>Vas a perder algo de masa magra</b> si el aeróbico sube mucho y no ajustas la comida. Es el costo real de llegar entero en marzo, y se recupera en 8–10 semanas después.</li>
    </ul>
    <p>En marzo, terminado el evento, se vuelve al bloque de offseason completo. El conmutador de arriba lo tiene guardado tal cual.</p>
  </div>
  <div class="note-block">
    <h3>Progresión de cargas</h3>
    <table class="wk">
      <tr><th>Ejercicio</th><th>Fase 1</th><th>Fase 2</th><th>Fase 3</th></tr>

      <tr><td>Cargada con mancuerna</td><td>20–30 kg</td><td>35–45 kg</td><td>50–60 kg</td></tr>
      <tr><td>Granjero (mancuerna)</td><td>35 kg</td><td>45–55 kg</td><td>60 kg+</td></tr>
      <tr><td>Mochila en cuestas</td><td>15 kg</td><td>25 kg</td><td>35 kg</td></tr>
      <tr><td>Mochila zona 2</td><td>12 kg</td><td>20 kg</td><td>25–30 kg</td></tr>

    <p style="margin-top:12px">Sube <b>una sola variable por semana</b>: o distancia, o peso. Nunca las dos. Si una semana el hombro amanece adolorido dos días seguidos, repite la semana anterior en vez de avanzar.</p>
  </div>
  <div class="note-block">
    <h3>Equipo · qué usar en vez de qué</h3>
    <p>Nada de este plan necesita gimnasio de crossfit. Estas son las sustituciones y por qué funcionan:</p>
    <table class="wk">
      <tr><th>Lo clásico</th><th>Tu versión</th><th>Dónde</th></tr>
      <tr><td>Yugo</td><td>Sostén con barra en el rack + caminata con barra al hombro</td><td>Gimnasio</td></tr>
      <tr><td>Costal</td><td>Cargada con mancuerna al hombro</td><td>Gimnasio</td></tr>
      <tr><td>Trineo</td><td>Cuestas con mochila cargada · prensa · caminadora en pendiente</td><td>Libre / gym</td></tr>
      <tr><td>Barra hexagonal</td><td>Peso muerto con barra normal</td><td>Gimnasio</td></tr>
      <tr><td>Asas de granjero</td><td>Una mancuerna pesada</td><td>Gimnasio</td></tr>
      <tr><td>Arnés de cuello</td><td>Disco sobre banco + isométricos con la mano</td><td>Gimnasio</td></tr>
      <tr><td>La cruz</td><td>Viga, tubo o barra acolchada al hombro</td><td>Libre</td></tr>
    </table>
    <p style="margin-top:12px">El <b>sostén con barra en el rack</b> es el que más rinde de todos: cargas la barra como para sentadilla, le pones una toalla, la desmontas y te quedas de pie. Con los pasadores puestos es seguro, cabe en cualquier gimnasio y es lo más parecido que existe a estar parado en una estación con la cruz encima.</p>
    <p>Para la <b>mochila</b>: discos o libros envueltos en toalla, bien pegados a la espalda y amarrados para que no bailen. Una mochila de senderismo con cinturón de cadera aguanta 30 kg sin problema; una escolar no.</p>
  </div>
  <div class="note-block amberblk">
    <h3>El último mes · con la cruz real</h3>
    <p>Como la cruz solo sale un mes antes, ese mes carga con toda la especificidad del plan <b>y además</b> con el bloque de calor. Está apretado, así que el orden importa:</p>
    <table class="wk">
      <tr><th>Semana</th><th>Sesión con la cruz</th><th>El resto</th></tr>
      <tr><td>Faltan 4</td><td><b>800 m</b> + 6 sostenes de 45 s. Primer contacto: aquí se ajusta el acolchado y se decide el hombro.</td><td>Gym normal. Arranca el calor.</td></tr>
      <tr><td>Faltan 3</td><td><b>1.5 km</b> en la ruta real, con las paradas de las estaciones.</td><td>Gym al 75%. Calor diario.</td></tr>
      <tr><td>Faltan 2</td><td><b>2.5 km</b>, horario y ropa del evento. <b>Sesión pico.</b></td><td>Gym al 60%. Calor diario.</td></tr>
      <tr><td>Faltan 1</td><td><b>500 m suaves</b>, solo para repasar el acolchado y el cambio de hombro.</td><td>Volumen a la mitad. Dormir.</td></tr>
    </table>
    <p style="margin-top:12px"><b>La primera sesión con la cruz nunca es el recorrido completo</b>, y ninguna es sin acompañante. Si en la sesión de "faltan 4" el hombro no aguanta los 800 m, no subas a 1.5 km la semana siguiente: repite y ajusta el acolchado.</p>
    <p>Los tres meses anteriores existen precisamente para que ese primer contacto no sea un salto al vacío. Si llegas con las marcas mínimas cubiertas, 800 m con la cruz se van a sentir duros pero manejables.</p>
  </div>
  <div class="note-block alert">
    <h3>Marcas mínimas antes de la cruz</h3>
    <p>Con <b>90 kg efectivos</b> esto deja de ser un reto de resistencia y pasa a ser un reto de fuerza. 90 kg sobre un solo hombro es <b>más que tu peso corporal</b>, y tu peso muerto actual es de 140 kg: el margen es más estrecho de lo que parece.</p>
    <p>Antes de la primera sesión con la cruz real deberías poder hacer todo esto sin drama:</p>
    <ul>
      <li><b>Peso muerto:</b> 4 × 5 con 170–180 kg</li>
      <li><b>Sentadilla frontal:</b> 4 × 5 con 90–100 kg</li>
      <li><b>Sostén con barra:</b> 60 s con 150 kg, erguido</li>
      <li><b>Acarreo a un hombro:</b> 40 m con 85 kg, sin ladearte</li>
      <li><b>Granjero:</b> 40 m con 55 kg en una mano</li>
      <li><b>Mochila:</b> 5 km con 30 kg sin quedar destruido</li>
    </ul>
    <p>Si a un mes del evento no llegas a estas marcas, <b>no fuerces el recorrido completo con la cruz</b>: haz los tramos con más ayuda o con carga parcial. El objetivo es llegar al evento entero, no demostrar algo en febrero.</p>
  </div>
  <div class="note-block amberblk">
    <h3>Lo que cambia con 90 kg</h3>
    <p>Tres cosas dejan de ser opcionales con este peso:</p>
    <ul>
      <li><b>El Cireneo.</b> Si la representación permite ayuda en algún tramo, úsala y ensáyala en las sesiones del último mes. Coordinar el reparto de peso con otra persona se practica: hacerlo por primera vez el día del evento, cansado y bajo el sol, es cuando la carga se desliza.</li>
      <li><b>Cambiar de hombro.</b> Cargar 90 kg del mismo lado durante 3 km deja la clavícula machacada y la columna en flexión lateral sostenida. Identifica desde ahora en qué puntos del guion puedes cambiar.</li>
      <li><b>El acolchado.</b> Con 50 kg una tela doblada alcanza; con 90 kg necesitas acolchado real y probado. La piel de la clavícula se abre y no se recupera a media procesión. <b>Pruébalo en la primera sesión con la cruz</b>, que para eso es.</li>
    </ul>
    <p>Y una nota de método: el sostén con barra carga <b>los dos hombros</b>, el acarreo a un hombro carga <b>uno solo</b>. Por eso el sostén llega a 160 kg y el acarreo unilateral se queda en 85–100 en tramos cortos. No intentes igualarlos: la columna tolera muchísimo más carga simétrica que asimétrica.</p>
  </div>
  <div class="note-block alert">
    <h3>Antes de empezar</h3>
    <p>El plan ya está calibrado a <b>~90 kg efectivos sobre el hombro</b>. Conviene confirmarlo con una prueba real en diciembre, porque el peso efectivo cambia mucho según cuánto arrastre la base y qué tanto se reparta.</p>
    <p>Y una cosa que sí o sí va antes de la primera sesión: <b>una revisión médica</b>, sobre todo de presión y corazón. Carga pesada más calor más esfuerzo prolongado estresa el sistema cardiovascular de forma distinta a entrenar bajo techo, y 90 kg no es una carga de conversación.</p>
  </div>

    <p>Adaptarte hace tres cosas medibles: aumenta tu volumen de plasma, adelanta el momento en que empiezas a sudar y baja tu pulso y tu temperatura interna a un mismo esfuerzo. Traducido: el mismo recorrido se siente notablemente menos brutal.</p>

    <ul>

    <p>La buena noticia es que <b>re-aclimatarse toma poco</b>, unos 4 a 5 días. Si te enfermas o pierdes el bloque, todavía hay rescate. Y si entre el bloque y el evento pasan más de 5 días, mete una sesión suelta en calor cada quinto día para sostener la adaptación.</p>

/* ============ REGISTRO DE MARCAS ============ */
function slug(n){
  return n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
          .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,44);
}
/* Interpreta el esquema del ejercicio: "4 × 6–10", "7 × 12", "3 × 20–30 s", "6 × 60 m", "3 × 12 /lado" */
function parseTarget(s){
  const m = (s||'').match(/(\d+)\s*×\s*(\d+)(?:\s*[–-]\s*(\d+))?\s*(s\b|seg|m\b|min|pasos)?/);
  if(!m) return null;
  const unidad = m[4] ? (m[4]==='s'||m[4]==='seg' ? 'seg' : m[4]==='m' ? 'm' : m[4]) : 'reps';
  if(unidad==='min') return null;                       // cardio: solo historial
  return {sets:+m[1], lo:+m[2], hi:m[3]?+m[3]:+m[2], unidad};
}
function getLog(){ try{ return JSON.parse(localStorage.getItem(B.logKey)||'{}'); }catch(e){ return {}; } }
function setLog(l){ try{ localStorage.setItem(B.logKey, JSON.stringify(l)); }catch(e){} }

/* ---- Respaldo de marcas (exportar / importar JSON) ----
   Backlog #1: todo vive en localStorage, así que el historial se pierde al cambiar de
   teléfono o al limpiar el navegador. El archivo es la única copia fuera del dispositivo. */
const IO_VER = 1;
/* Identidad de una entrada: mismo instante, mismo peso y mismo valor = la misma marca. */
function entKey(x){ return x.t + '|' + (x.w == null ? '' : x.w) + '|' + x.v; }
/* Descarta basura del archivo y normaliza tipos antes de tocar el historial real. */
function limpiaEntrada(x){
  if(!x || typeof x !== 'object') return null;
  const t = Number(x.t), v = Number(x.v);
  if(!isFinite(t) || t <= 0 || !isFinite(v)) return null;
  const w = (x.w === null || x.w === undefined || x.w === '') ? null : Number(x.w);
  if(w !== null && !isFinite(w)) return null;
  return {t, w, v};
}
/* Fusiona src dentro de dest sin duplicar. Devuelve el conteo para el aviso. */
function fusionarMarcas(dest, src){
  let nuevas = 0, repetidas = 0, ejercicios = 0, descartadas = 0;
  Object.keys(src || {}).forEach(id => {
    const lista = Array.isArray(src[id]) ? src[id] : null;
    if(!lista) { descartadas++; return; }
    const actual = Array.isArray(dest[id]) ? dest[id] : [];
    const vistas = new Set(actual.map(entKey));
    let sumadas = 0;
    lista.forEach(raw => {
      const e = limpiaEntrada(raw);
      if(!e){ descartadas++; return; }
      const k = entKey(e);
      if(vistas.has(k)){ repetidas++; return; }
      vistas.add(k); actual.push(e); sumadas++;
    });
    if(sumadas){
      /* El orden cronológico es invariante del motor: sugerir() lee la última entrada
         y spark() dibuja las últimas 10. Reordenar aquí es obligatorio. */
      actual.sort((a,b)=> a.t - b.t);
      dest[id] = actual;
      nuevas += sumadas; ejercicios++;
    } else if(actual.length){
      dest[id] = actual;
    }
  });
  return {nuevas, repetidas, ejercicios, descartadas};
}
function nombreArchivo(){
  const d = new Date();
  const p2 = n => String(n).padStart(2,'0');
  return `rutina-marcas-${mode}-${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}.json`;
}
function exportarMarcas(){
  const marcas = getLog();
  const total = Object.keys(marcas).reduce((a,k)=> a + (marcas[k]||[]).length, 0);
  const payload = {
    app:'rutina', v:IO_VER, bloque:mode, clave:B.logKey,
    exportado:new Date().toISOString(), ejercicios:Object.keys(marcas).length,
    entradas:total, marcas
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombreArchivo();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  return {total, ejercicios:payload.ejercicios, archivo:a.download};
}
/* Lee el texto del archivo y devuelve el resumen de la fusión, o {error}. */
function aplicarImport(txt){
  let data;
  try{ data = JSON.parse(txt); }
  catch(e){ return {error:'Ese archivo no es un JSON válido. Usa el que descargaste con Exportar.'}; }
  const marcas = (data && typeof data === 'object')
    ? (data.marcas && typeof data.marcas === 'object' && !Array.isArray(data.marcas) ? data.marcas
      : (!data.app && !data.marcas && !Array.isArray(data) ? data : null))
    : null;
  if(!marcas) return {error:'No encontré marcas en ese archivo.'};
  if(data.bloque && data.bloque !== mode){
    const otro = BLOCKS[data.bloque] ? BLOCKS[data.bloque].name : data.bloque;
    if(!confirm(`Ese respaldo es del bloque "${otro}" y estás en "${B.name}".\n\n¿Importarlo aquí de todas formas?`))
      return {error:'Importación cancelada. Cambia de bloque arriba y vuelve a intentar.'};
  }
  const log = getLog();
  const r = fusionarMarcas(log, marcas);
  if(r.nuevas) setLog(log);
  return r;
}
function rondaPeso(x){ return Math.round(x/2.5)*2.5; }
function fmtKg(x){ return (x%1? x.toFixed(1): x) + ' kg'; }
function fmtCuando(t){
  const d = Math.floor((Date.now()-t)/86400000);
  return d<=0?'hoy':d===1?'ayer':`hace ${d} d`;
}
function paso(u){ return u==='seg'||u==='m' ? 5 : 1; }
/* La sugerencia: doble progresión sobre la peor serie */
function sugerir(e, hist){
  /* Calentamiento (pogos): la invariante 2 dice reps bajas y nunca al fallo. Si cayera en la
     rama de peso corporal, al tocar el techo pediría lastre — justo lo contrario. */
  if(e.prep){
    return {t:'Calentamiento: se progresa en calidad de contacto, no en carga. Nunca lo lastres ni lo lleves al fallo — si el rebote se alarga o suena, cierra la serie.', c:'dim'};
  }
  if(e.medida==='cm'){
    return hist.length
      ? {t:'Prueba de pared cada 3 semanas: misma pared, mismo calzado, el mejor de 3 intentos. La gráfica te dice si el plan paga.', c:'dim'}
      : {t:'Anota aquí los cm de tu prueba de pared (alcance saltando − alcance de pie). Repite cada 3 semanas.', c:'dim'};
  }
  const tg = parseTarget(e.s);
  const u = tg ? tg.unidad : 'reps';
  const unidadTxt = u==='seg'?'s':u==='m'?'m':u==='pasos'?' pasos':'';
  if(!hist.length) return {t:'Registra tu primera marca para activar la sugerencia.', c:'dim'};
  if(!tg) return null;
  const L = hist[hist.length-1];
  if(L.w==null || L.w===0){   // peso corporal
    if(L.v>=tg.hi) return {t:`Tope del rango sin peso: agrega lastre o pasa a una variante más dura.`, c:'volt'};
    if(L.v<tg.lo)  return {t:`Aún bajo el rango: usa asistencia o reduce el rango de movimiento hasta llegar a ${tg.lo}${unidadTxt}.`, c:'amber'};
    return {t:`Mantén: busca ${L.v+paso(u)}${unidadTxt} (techo ${tg.hi}${unidadTxt}).`, c:'dim'};
  }
  if(L.v>=tg.hi){
    const nuevo = rondaPeso(Math.max(L.w+2.5, L.w*1.025));
    return {t:`✦ Tocaste el techo (${tg.hi}${unidadTxt}): sube a ${fmtKg(nuevo)} y vuelve a ${tg.lo}${unidadTxt}.`, c:'volt'};
  }
  if(L.v<tg.lo){
    return {t:`Quedaste bajo el piso (${tg.lo}${unidadTxt}): repite con ${fmtKg(rondaPeso(L.w*0.95))} o consolida con ${fmtKg(L.w)}.`, c:'amber'};
  }
  return {t:`Mantén ${fmtKg(L.w)} y busca ${L.v+paso(u)}${unidadTxt} en tu peor serie (techo ${tg.hi}${unidadTxt}).`, c:'dim'};
}
function calcPR(e, hist){
  if(!hist.length) return null;
  if(e.medida==='cm') return hist.reduce((a,b)=>b.v>a.v?b:a).v + ' cm';
  const tg = parseTarget(e.s);
  const conPeso = hist.filter(x=>x.w>0);
  if(conPeso.length){
    const validas = tg ? conPeso.filter(x=>x.v>=tg.lo) : conPeso;
    const pool = validas.length?validas:conPeso;
    const best = pool.reduce((a,b)=> b.w>a.w || (b.w===a.w && b.v>a.v) ? b:a);
    return `${fmtKg(best.w)} × ${best.v}`;
  }
  const best = hist.reduce((a,b)=> b.v>a.v?b:a);
  const u = tg&&tg.unidad==='seg'?' s':tg&&tg.unidad==='m'?' m':'';
  return `${best.v}${u}`;
}
function spark(hist){
  if(hist.length<2) return '';
  const vals = hist.slice(-10).map(x=> x.w>0 ? x.w : x.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const w=96, h=26, pad=3;
  const pts = vals.map((v,i)=>{
    const x = pad + i*(w-2*pad)/(vals.length-1);
    const y = max===min ? h/2 : h-pad-(v-min)*(h-2*pad)/(max-min);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const subio = vals[vals.length-1]>vals[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${subio?'#c8fb3d':'#8b9296'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function logPanel(exId, e){
  const hist = getLog()[exId]||[];
  const sug = sugerir(e, hist);
  const pr = calcPR(e, hist);
  const tg = parseTarget(e.s);
  const uTxt = e.medida==='cm' ? 'cm salto' : tg ? (tg.unidad==='seg'?'seg':tg.unidad==='m'?'metros':tg.unidad==='pasos'?'pasos':'reps') : 'reps';
  const ult = hist.slice(-3).reverse().map(x=>
    `<div class="log-hist">${x.w>0?fmtKg(x.w)+' × ':''}${x.v}${uTxt==='seg'?' s':uTxt==='metros'?' m':uTxt==='cm salto'?' cm':''}<span>${fmtCuando(x.t)}</span></div>`).join('');
  return `
    <div class="log-top">
      ${pr?`<div class="log-pr">PR <b>${pr}</b></div>`:`<div class="log-pr dim">Sin marcas aún</div>`}
      ${spark(hist)}
    </div>
    ${ult}
    ${sug?`<div class="sugg s-${sug.c}">${sug.t}</div>`:''}
    <div class="log-inputs">
      <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" data-w>
      <input type="number" inputmode="numeric" step="1" min="0" placeholder="${uTxt}" data-v>
      <button class="logbtn" data-save="${exId}">Guardar</button>
      ${hist.length?`<button class="logundo" data-undo="${exId}" title="Borrar última">↩</button>`:''}
    </div>`;
}

/* ---- Precarga de fotos para uso offline (backlog #8) ----
   OJO: este nombre DEBE coincidir con la constante FOTOS de sw.js. Si se separan, la página
   guardaría en una caché que el service worker nunca consulta y el offline fallaría en silencio. */
const FOTOS_CACHE = 'rutina-fotos';
const FOTOS_PARALELO = 6;

/* Todas las URLs de foto del bloque activo, sin repetir.
   Los ejercicios con `seq` son SVG inline: ya funcionan offline, no se descargan. */
function fotosDelBloque(){
  const urls = new Set();
  Object.values(B.days).forEach(d => d.ex.forEach(e => {
    if(!e.id) return;
    urls.add(IMG + e.id + '/0.jpg');
    urls.add(IMG + e.id + '/1.jpg');
  }));
  return [...urls];
}
/* Devuelve 'ya' | 'nueva' | 'error'. No re-descarga lo que ya está guardado. */
async function guardaFoto(cache, url){
  if(await cache.match(url)) return 'ya';
  let res = null;
  try{
    res = await fetch(url);                       // raw.githubusercontent responde con CORS
  }catch(e){
    try{ res = await fetch(url, {mode:'no-cors'}); }   // respaldo: respuesta opaca, igual sirve
    catch(e2){ return 'error'; }
  }
  if(!res || !(res.ok || res.type === 'opaque')) return 'error';
  try{ await cache.put(url, res); }catch(e){ return 'error'; }
  return 'nueva';
}
/* Descarga en paralelo limitado: 6 a la vez para no saturar la red del teléfono. */
async function precacheFotos(urls, alAvanzar){
  const cache = await caches.open(FOTOS_CACHE);
  const cola = urls.slice();
  let hechas = 0, nuevas = 0, ya = 0, fallos = 0;
  const obrero = async () => {
    while(cola.length){
      const r = await guardaFoto(cache, cola.shift());
      if(r === 'nueva') nuevas++; else if(r === 'ya') ya++; else fallos++;
      hechas++;
      if(alAvanzar) alAvanzar(hechas, urls.length);
    }
  };
  await Promise.all(Array.from({length: Math.min(FOTOS_PARALELO, urls.length)}, obrero));
  return {total: urls.length, nuevas, ya, fallos, guardadas: nuevas + ya};
}

    const marcas = getLog();
    if(!Object.keys(marcas).length){
      di(`Todavía no hay marcas en <b>${B.name}</b>: registra algo antes de exportar.`, true);
      return;
    }
    try{
      const r = exportarMarcas();
      di(`Listo: <b>${r.total}</b> ${r.total===1?'marca':'marcas'} de <b>${r.ejercicios}</b> ${r.ejercicios===1?'ejercicio':'ejercicios'} en <b>${r.archivo}</b>. Guárdalo fuera del teléfono.`);
    }catch(e){
      di('No se pudo generar el archivo en este navegador.', true);
    }
  });

  bI.addEventListener('click', ()=>{ file.value = ''; file.click(); });

  file.addEventListener('change', ()=>{
    const f = file.files && file.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onerror = ()=> di('No se pudo leer el archivo.', true);
    rd.onload = ()=>{
      const r = aplicarImport(String(rd.result));
      if(r.error){ di(r.error, true); return; }
      if(!r.nuevas){
        di(`Sin cambios: las <b>${r.repetidas}</b> ${r.repetidas===1?'marca ya estaba':'marcas ya estaban'} en este dispositivo.`);
        return;
      }
      const extra = [];
      if(r.repetidas) extra.push(`${r.repetidas} ya ${r.repetidas===1?'estaba':'estaban'}`);
      if(r.descartadas) extra.push(`${r.descartadas} con formato inválido`);
      di(`Importadas <b>${r.nuevas}</b> ${r.nuevas===1?'marca nueva':'marcas nuevas'} en <b>${r.ejercicios}</b> ${r.ejercicios===1?'ejercicio':'ejercicios'}${extra.length?` · ${extra.join(' · ')}`:''}.`);
    };
    rd.readAsText(f);
  });

  /* ---- Guardar todas las fotos del bloque (backlog #8) ---- */
  const go = document.getElementById('fotoGo');
  const prog = document.getElementById('fotoProg');
  const fmsg = document.getElementById('fotoMsg');
  if(!go || !prog || !fmsg) return;
  const barra = prog.querySelector('.prog-bar i');
  const etiqueta = prog.querySelector('[data-etiqueta]');
  const cuenta = prog.querySelector('[data-cuenta]');
  const fdi = (txt, err) => { fmsg.innerHTML = `<div class="io-msg${err?' err':''}">${txt}</div>`; };

  go.addEventListener('click', async ()=>{
    if(go.disabled) return;
    fmsg.innerHTML = '';
    if(!('caches' in window)){
      fdi('Este navegador no puede guardar fotos para uso offline. Necesitas abrir la app por <b>https</b> (así está en GitHub Pages).', true);
      return;
    }
    const urls = fotosDelBloque();
    if(!urls.length){ fdi(`<b>${B.name}</b> no tiene fotos que guardar: sus fichas son ilustraciones, que ya funcionan sin conexión.`); return; }
    if(navigator.onLine === false){
      fdi('Estás sin conexión. Conéctate a wifi y vuelve a intentarlo: esto justamente sirve para prepararte <i>antes</i> de salir.', true);
      return;
    }
    go.disabled = true;
    const textoOriginal = go.textContent;
    go.textContent = 'Guardando…';
    prog.classList.add('on');
    barra.style.width = '0%';
    etiqueta.textContent = `Fotos de ${B.name}`;
    cuenta.textContent = `0 / ${urls.length}`;
    try{
      const r = await precacheFotos(urls, (hechas, total)=>{
        barra.style.width = Math.round(hechas*100/total) + '%';
        cuenta.innerHTML = `<b>${hechas}</b> / ${total}`;
      });
      const partes = [];
      if(r.nuevas) partes.push(`${r.nuevas} ${r.nuevas===1?'nueva':'nuevas'}`);
      if(r.ya) partes.push(`${r.ya} ya ${r.ya===1?'estaba':'estaban'}`);
      if(r.fallos){
        fdi(`Guardadas <b>${r.guardadas}</b> de <b>${r.total}</b> fotos${partes.length?` · ${partes.join(' · ')}`:''}. <b>${r.fallos}</b> no se pudieron descargar — vuelve a tocar el botón con mejor señal y solo reintentará esas.`, true);
      }else{
        fdi(`Listo: las <b>${r.total}</b> fotos de <b>${B.name}</b> están guardadas${partes.length?` (${partes.join(' · ')})`:''}. Las fichas ya abren sin conexión.`);
      }
    }catch(e){
      fdi('No se pudieron guardar las fotos en este navegador.', true);
    }finally{
      go.disabled = false;
      go.textContent = textoOriginal;
      prog.classList.remove('on');
    }
  });
}

function renderDay(key){
  if(B.pages[key]){
    tabs.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.day===key));
    main.innerHTML = `<div class="panel active">${B.pages[key]}</div>`;
    const ev = document.getElementById('evInput');
    if(ev){
      ev.value = localStorage.getItem('rutina_evento') || EVENTO_DEF;
      ev.addEventListener('change', ()=>{
        if(!ev.value) return;
        localStorage.setItem('rutina_evento', ev.value);
        renderPhase();
      });
    }
    wireIO();
    return;
  }
  tabs.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.day===key));
  const DAYS = B.days;
  const d = DAYS[key];
  let html = `<div class="panel active"><div class="day-head"><div class="day-title">${d.title}</div><br><span class="day-focus">${d.focus}</span></div>`;
  d.ex.forEach((e,i)=>{
    const id = key+'_'+i;
    const done = store[id] ? ' done':'';
    const lid = `${key}:${slug(e.n)}`;
    const _h = (getLog()[lid]||[]);
    const _s = _h.length ? sugerir(e,_h) : null;
    const mCls = _s ? (_s.c==='volt'?' hot':_s.c==='amber'?' warm':'') : '';
    const mTxt = mCls===' hot' ? '📈 ✦ Toca subir peso' : mCls===' warm' ? '📈 Marca · revisa' : '📈 Marca';
    const [label, cls] = TAGS[e.tag] || TAGS.hiper;
    if(e.sec) html += `<div class="sec"><span>${e.sec}</span></div>`;
    html += `<div class="ex${e.fst?' fst':''}${done}" data-id="${id}">
      <div class="check" role="checkbox"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="ex-top">
        <div class="num">${(i+1).toString().padStart(2,'0')}</div>
        <div class="ex-body">
          <div class="ex-name">${e.n}</div>
          <div class="ex-sets">
            <span class="sets-badge">${e.s}</span>
            ${e.fst?'<span class="fst-tag">FST-7</span>':''}
            <span class="tag ${cls}">${label}</span>
            ${e.env?`<span class="env e-${e.env}">${ENVS[e.env]}</span>`:''}
            ${e.opt?'<span class="opt">Opcional</span>':''}
            <span class="rest">⏱ ${e.r}</span>
          </div>
          <div class="cue">${e.cue}</div>
          <div class="btnrow">
          ${(e.id||e.seq)
            ? `<button class="form-btn" data-form="${key}:${i}">▣ Ver forma</button>`
            : `<a class="form-btn link" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.yt||e.n)}">▷ Ver video</a>`}
          <button class="form-btn${mCls}" data-logtoggle="${lid}">${mTxt}</button>
          </div>
          <div class="logbox" data-box="${lid}"></div>
        </div>
      </div>
    </div>`;
  });
  html += `<button class="reset" id="resetBtn">Reiniciar marcas de hoy</button></div>`;
  main.innerHTML = html;

  main.querySelectorAll('.ex').forEach(el=>{
    el.querySelector('.check').addEventListener('click', ()=>{
      const id = el.dataset.id;
      el.classList.toggle('done');
      store[id] = el.classList.contains('done');
      if(!store[id]) delete store[id];
      save();
    });
  });
  main.querySelectorAll('[data-form]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const [k,i] = b.dataset.form.split(':');
      openForm(DAYS[k].ex[+i]);
    });
  });
  /* --- panel de marcas --- */
  const exDe = id => DAYS[key].ex.find(x=> `${key}:${slug(x.n)}`===id);
  const pinta = id => {
    const box = main.querySelector(`[data-box="${id}"]`);
    if(!box) return;
    box.innerHTML = logPanel(id, exDe(id));
    const e = exDe(id), hh = getLog()[id]||[];
    const ss = hh.length ? sugerir(e,hh) : null;
    const cls = ss ? (ss.c==='volt'?' hot':ss.c==='amber'?' warm':'') : '';
    const btn = main.querySelector(`[data-logtoggle="${id}"]`);
    if(btn){ btn.className = 'form-btn'+cls;
      btn.textContent = cls===' hot' ? '📈 ✦ Toca subir peso' : cls===' warm' ? '📈 Marca · revisa' : '📈 Marca'; }
    box.querySelector('[data-save]').addEventListener('click', ()=>{
      const w = parseFloat(box.querySelector('[data-w]').value);
      const v = parseFloat(box.querySelector('[data-v]').value);
      if(isNaN(v) || v<=0) return;
      const l = getLog();
      (l[id] = l[id]||[]).push({t:Date.now(), w:isNaN(w)?null:w, v});
      setLog(l); pinta(id);
    });
    const u = box.querySelector('[data-undo]');
    if(u) u.addEventListener('click', ()=>{
      const l = getLog();
      if(l[id] && l[id].length){ l[id].pop(); if(!l[id].length) delete l[id]; setLog(l); pinta(id); }
    });
  };
  main.querySelectorAll('[data-logtoggle]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.logtoggle;
      const box = main.querySelector(`[data-box="${id}"]`);
      const abre = !box.classList.contains('open');
      box.classList.toggle('open', abre);
      if(abre) pinta(id);
    });
  });
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    DAYS[key].ex.forEach((e,i)=>{ delete store[key+'_'+i]; });
    save(); renderDay(key);
  });
}

function openForm(e){
  document.getElementById('mTitle').textContent = e.n;
  const shots = document.getElementById('mShots');
  if(e.seq && SEQ[e.seq]){
    shots.innerHTML = SEQ[e.seq].map(([lbl,svg])=>`<div class="shot">${svg}<em>${lbl}</em></div>`).join('');
  } else {
    shots.innerHTML = `
      <div class="shot"><img src="${IMG+e.id}/0.jpg" alt="Posición inicial"><em>Inicio</em></div>
      <div class="shot"><img src="${IMG+e.id}/1.jpg" alt="Posición final"><em>Final</em></div>`;
  }
  const steps = e.steps || (e.cue||'').replace(/<[^>]+>/g,'').split(/\.\s+/).filter(s=>s.trim()).map(s=>s.trim().replace(/\.$/,''));
  document.getElementById('mSteps').innerHTML = steps.map(s=>`<li>${s}</li>`).join('');
  document.getElementById('mYt').href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent((e.yt||e.n) + ' técnica correcta');
  modal.classList.add('open');
}

document.getElementById('mClose').addEventListener('click', ()=>modal.classList.remove('open'));
modal.addEventListener('click', ev=>{ if(ev.target===modal) modal.classList.remove('open'); });
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape') modal.classList.remove('open'); });

tabs.addEventListener('click', ev=>{
  const btn = ev.target.closest('.tab');
  if(!btn) return;
  window.scrollTo({top:0,behavior:'instant'});
  renderDay(btn.dataset.day);
});

loadStore();
renderShell();
renderTabs();
renderDay(B.tabs[0][0]);

/* ---- PWA: registro del service worker (backlog #4) ----
   Ruta RELATIVA: el deploy vive en un subpath (/rutina/) y './sw.js' fija el alcance ahí.
   Con '/sw.js' el navegador lo buscaría en la raíz del dominio y fallaría. */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* sin offline, la app sigue igual */ });
  });
}
